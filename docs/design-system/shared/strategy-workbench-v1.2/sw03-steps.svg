: 500 14px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#E6EDF7">当前输入尚未保存，要怎样处理？</text><text x="544" y="280" text-anchor="start" style="font: 500 12px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#A8B6CB">策略包：EMA20 买入 · 起点：2024-06-14</text><rect x="544" y="318" width="148" height="36" rx="6" fill="#6CA8FF" stroke="#6CA8FF" stroke-width="1"/><text x="618.0" y="341" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:600;fill:#0B1019">保留草稿并离开</text><rect x="544" y="366" width="120" height="36" rx="6" fill="#111A26" stroke="#283448" stroke-width="1"/><text x="604.0" y="389" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:600;fill:#E6EDF7">放弃草稿</text><rect x="672" y="366" width="120" height="36" rx="6" fill="#111A26" stroke="#283448" stroke-width="1"/><text x="732.0" y="389" text-anchor="middle" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:600;fill:#E6EDF7">继续编辑</text><text x="544" y="430" text-anchor="start" style="font: 500 12px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;fill:#A8B6CB">默认焦点：继续编辑；取消离开不提交。</text></svg>