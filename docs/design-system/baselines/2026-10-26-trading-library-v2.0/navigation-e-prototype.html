<!doctype html><html lang="zh-CN" data-document-id="TRADING-LIBRARY-V20" data-document-version="2.0"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交易库 · E 几何参考 · V2.0</title><style>
:root {

* { box-sizing:border-box }
html,body { margin:0; min-width:960px; background:var(--bg); color:var(--text); font:14px/20px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif }
button,select { font:inherit; color:inherit }
button { cursor:pointer }
button:focus-visible,select:focus-visible { outline:2px solid var(--blue2); outline-offset:2px }
.app { height:100vh; overflow:hidden }
.side { position:fixed; inset:0 auto 0 0; width:72px; background:#0E1622; border-right:1px solid var(--line); z-index:3 }
.brand { height:64px; display:flex; justify-content:center; padding-top:16px; color:var(--blue); font-size:20px; line-height:24px; font-weight:700 }
.side-nav { display:grid; gap:8px; padding-top:9px }
.side-item { width:56px; height:56px; margin:auto; border-radius:8px; color:var(--muted); display:flex; flex-direction:column; align-items:center; padding-top:5px; gap:7px; font-size:12px; line-height:16px }
.side-item svg { width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round }
.side-item.active { color:var(--blue); background:#1C2B42 }
.top { height:64px; margin-left:72px; padding:0 24px; display:flex; align-items:center; border-bottom:1px solid var(--line); background:var(--bg) }
.top h1 { font-size:24px; line-height:32px; margin:0; font-weight:700 }
.main { height:calc(100vh - 64px - 64px); margin-left:72px; padding:0 24px 24px; overflow-y:auto; scrollbar-gutter:stable; background:var(--bg); position:relative }
.subnav { height:58px; display:flex; align-items:center; gap:18px; margin:0 -24px 18px; padding:0 24px; border-bottom:1px solid var(--line); background:var(--bg) }
.nav-controls,.mode { display:flex; align-items:center }
.mode { padding:3px; border:1px solid var(--line); border-radius:9px; background:var(--panel) }

.mode button[aria-checked=true] { background:#243B5C; color:var(--blue2); box-shadow:inset 0 0 0 1px #6CA8FF80; font-weight:700 }

.app[data-mode=simulation] .subnav { box-shadow:inset 0 2px 0 #607C96; border-bottom-color:#40566D }
.app[data-mode=simulation] .state,.app[data-mode=simulation] .panel,.app[data-mode=simulation] .metric { background:#162332; border-color:#40566D }
.tool-row { display:flex; align-items:end; gap:18px; padding:0 0 18px }
.field { display:grid; gap:5px }
.field label { font-size:12px; line-height:16px; color:var(--muted) }

.field.date select { min-width:290px }

.table-head { display:flex; justify-content:space-between; margin-bottom:16px }
.table-wrap { overflow-x:auto }
.table { width:100%; border-collapse:collapse }
.table th,.table td { padding:0 12px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap }
.table th { height:40px; color:var(--muted); font-size:12px; font-weight:500 }
.table td { height:48px }
.table .num { text-align:right }
.tag { display:inline-flex; padding:3px 8px; border-radius:999px; background:var(--elevated); color:var(--muted); font-size:12px; line-height:16px }
.tag.green { color:var(--green) } .tag.orange { color:var(--orange) }

.cards.simulation-cards { grid-template-columns:repeat(4,minmax(0,1fr)) }
.metric { padding:14px 15px; background:var(--panel); border:1px solid var(--line); border-radius:9px }
.metric .label { display:flex; align-items:center; min-height:36px; color:var(--muted); font-size:12px; line-height:16px; white-space:nowrap }
.metric .value { display:block; margin-top:4px; font-size:28px; line-height:34px; font-weight:700 }
.positive { color:var(--green) } .negative { color:var(--red) }
.drawdown { display:flex; align-items:center; gap:10px; margin:-6px 0 12px; color:var(--muted); font-size:12px }
.drawdown strong { font-weight:500 }
.panel h3 { margin:0; display:flex; align-items:center; font-size:18px; line-height:24px; min-height:36px }
.panel p { margin:0; color:var(--muted); font-size:12px; line-height:16px }
#content>.panel+.panel { margin-top:18px }
.chart { height:188px; margin-top:12px }
.chart svg { width:100%; height:100% }

.chart .zero { stroke:var(--quiet); stroke-dasharray:4 4 }
.chart polyline { fill:none; stroke:var(--blue); stroke-width:2 }
.chart circle { fill:var(--blue2); stroke:var(--blue); stroke-width:2 }
.dist { display:grid; gap:10px; margin-top:16px }
.dist-row { display:grid; grid-template-columns:110px 1fr 55px 65px; gap:10px; align-items:center; color:var(--muted); font-size:12px; line-height:16px }
.bar { height:8px; border-radius:8px; background:var(--line); overflow:hidden }
.bar i { display:block; height:100%; border-radius:8px; background:var(--quiet) }
.bar i.win { background:var(--green) } .bar i.loss { background:var(--red) }
.measure-toggle { display:inline-flex; margin-left:12px; gap:2px }
.measure-toggle button { min-height:36px; padding:3px 8px; border:1px solid var(--line); border-radius:5px; background:transparent; color:var(--muted); font-size:14px; font-weight:400 }
.measure-toggle button[aria-pressed=true] { color:var(--blue2); background:#243B5C }
.help-wrap { display:inline-flex; align-items:center; gap:4px; vertical-align:middle }
.help-label { font-size:12px; line-height:16px; color:var(--muted); font-weight:400 }
.help-icon { width:36px; height:36px; flex-shrink:0; padding:10px; border:0; border-radius:6px; background:transparent; color:var(--muted); display:grid; place-items:center }
.help-icon:hover { color:var(--blue); background:#1C2B42 }
.help-icon svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linecap:round }
.help-popover { position:fixed; z-index:20; width:280px; padding:12px; background:var(--elevated); border:1px solid var(--line); border-radius:8px; box-shadow:0 12px 28px #0006; color:var(--text); font-size:12px; line-height:20px; font-weight:400; white-space:normal }
.help-popover[hidden] { display:none }
.compare { position:fixed; left:72px; right:0; bottom:0; height:64px; display:flex; align-items:center; justify-content:center; gap:12px; background:var(--bg); border-top:1px solid var(--line); z-index:5 }
.visual-sample-note { font-size:12px; color:var(--quiet) }
.mini-field { display:flex; gap:8px; align-items:center; color:var(--muted); font-size:12px }
.compare select { height:36px; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel) }
.empty,.loading { min-height:350px; display:grid; place-items:center; text-align:center; color:var(--muted) }
.empty strong,.loading strong { display:block; color:var(--text); font-size:18px; line-height:24px; margin-bottom:6px }
.skeletons { width:min(640px,90%); display:grid; gap:12px }
.skeleton { height:48px; border-radius:8px; background:linear-gradient(90deg,#162233,#243B5C,#162233); background-size:200% 100%; animation:shine 1.2s linear infinite }
@keyframes shine { to{background-position:-200% 0} }
@media(max-width:1240px) { .cards:not(.simulation-cards){grid-template-columns:repeat(3,minmax(0,1fr))} }
@media(prefers-reduced-motion:reduce) { .skeleton{animation:none} }

'57.14%']],distributionAmount:[['亏损 > 100',1,'loss','14.29%'],['亏损 0–100',1,'loss','14.29%'],['持平',0,'','0.00%'],['盈利 0–100',1,'win','14.29%'],['盈利 > 100',4,'win','57.14%']],exercises:[['2026-10-15','练习 A','贵州茅台','600519','3','2','70'],['2026-10-15','练习 E','贵州茅台','600519','2','1','0'],['2026-10-16','练习 C','平安银行','000001','2','1','0'],['2026-10-17','练习 D','宁德时代','300750','2','1','0'],['2026-10-18','练习 B','贵州茅台','600519','2','1','0'],['2026-10-19','练习 F','招商银行','600036','2','1','0']]}};
const state={mode:'live',page:'list',preview:'normal',measure:'rate',date:{live:'fixture',simulation:'fixture'}};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function current(){return fixtures[state.mode]}function range(){return state.date[state.mode]==='long'?'2026-10-01 至 2026-10-31 · 扩展范围':current().dates[state.page]}function modeControls(){return `<div class="nav-controls"><div class="mode ${state.mode==='simulation'?'sim-boundary':''}" id="mode-control" role="radiogroup" aria-label="账户模式"><button id="mode-live" type="button" role="radio" aria-checked="${state.mode==='live'}" data-mode="live">实盘</button><button id="mode-simulation" type="button" role="radio" aria-checked="${state.mode==='simulation'}" data-mode="simulation">模拟盘</button></div></div>`}function tabs(){return `<div class="tabs" id="page-tabs" role="tablist" aria-label="交易库页面"><button id="page-list" type="button" role="tab" aria-selected="${state.page==='list'}" data-page="list">列表</button><button id="page-stats" type="button" role="tab" aria-selected="${state.page==='stats'}" data-page="stats">统计</button></div>`}
function header(){return ''}

function body(){if(state.preview==='loading')return `<div class="state loading"><div class="skeletons"><strong>正在加载样例</strong><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></div>`;if(state.preview==='empty')return `<div class="state empty"><div><strong>暂无${state.page==='list'?'记录':'统计样本'}</strong><p>当前日期和账户模式没有可展示的样例结果。</p></div></div>`;return state.page==='list'?list():stats()}

function pnlClass(label,value){
  if(!['累计净盈亏','平均盈利','平均亏损'].includes(label))return '';
  const n=Number(String(value).replace(/,/g,''));
  return n>0?'positive':n<0?'negative':'';

  return `<span class="help-wrap" data-help="${id}">${showLabel?`<span class="help-label">${label}</span>`:''}<button class="help-icon" id="${id}" type="button" aria-label="${label}" aria-describedby="${id}-tip" aria-expanded="false"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 7v4M8 4.5h.01"/></svg></button><span class="help-popover" id="${id}-tip" role="tooltip" hidden>${body}</span></span>`;

function closeHelp(w){w.querySelector('[role=tooltip]').hidden=true;w.querySelector('button').setAttribute('aria-expanded','false');w.dataset.pinned='false'}
function openHelp(w){
  document.querySelectorAll('.help-wrap').forEach(other=>{if(other!==w)closeHelp(other)});
  const p=w.querySelector('[role=tooltip]'),b=w.querySelector('button');
  p.hidden=false;b.setAttribute('aria-expanded','true');
  // A fixed overlay follows its trigger and is kept within the viewport.
  const r=w.getBoundingClientRect(),pr=p.getBoundingClientRect();
  p.style.left=Math.max(12,Math.min(r.left,innerWidth-pr.width-12))+'px';
  p.style.top=(r.bottom+8+pr.height>innerHeight-12?Math.max(12,r.top-pr.height-8):r.bottom+8)+'px';
}
function render(){
  const focusId=document.activeElement?.id;
  $('app').className='app';$('app').dataset.mode=state.mode;
  $('sub-controls').innerHTML=modeControls()+tabs();
  $('content').innerHTML=tools()+body();
  $('prototype-help-slot').innerHTML=help('prototype-help','样例说明','本页使用固定样例数据。扩展日期范围仍包含同一组记录；“预览”可查看加载和空结果。刷新后恢复实盘列表、默认日期和收益率分布。');
  $('preview-select').value=state.preview;
  bind();
  if(focusId&&$(focusId))$(focusId).focus();
}
function bind(){
  document.querySelectorAll('[data-mode]').forEach(b=>{if(b.tagName!=='BUTTON')return;
    b.onclick=()=>{state.mode=b.dataset.mode;render()};
    b.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();state.mode=e.key==='ArrowLeft'?'live':'simulation';render();$('mode-'+state.mode).focus()}}
  });
  document.querySelectorAll('[data-page]').forEach(b=>{
    b.onclick=()=>{state.page=b.dataset.page;render()};
    b.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();state.page=e.key==='ArrowLeft'?'list':'stats';render();$('page-'+state.page).focus()}}
  });
  document.querySelectorAll('[data-measure]').forEach(b=>b.onclick=()=>{state.measure=b.dataset.measure;render()});
  $('date-range').onchange=e=>{state.date[state.mode]=e.target.value;render()};
  $('preview-select').onchange=e=>{state.preview=e.target.value;render()};
  document.querySelectorAll('.help-wrap').forEach(w=>{
    const b=w.querySelector('button');
    w.onmouseenter=()=>openHelp(w);
    w.onmouseleave=()=>{if(w.dataset.pinned!=='true')closeHelp(w)};
    b.onfocus=()=>openHelp(w);
    b.onblur=()=>closeHelp(w);
    b.onclick=()=>{if(w.dataset.pinned==='true')closeHelp(w);else{openHelp(w);w.dataset.pinned='true'}};
  });
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.help-wrap').forEach(closeHelp)});
document.addEventListener('click',e=>{if(!e.target.closest('.help-wrap'))document.querySelectorAll('.help-wrap').forEach(closeHelp)});
addEventListener('resize',()=>document.querySelectorAll('.help-wrap').forEach(closeHelp));
document.addEventListener('scroll',()=>document.querySelectorAll('.help-wrap').forEach(closeHelp),true);
render();
})();
</script></body></html>
