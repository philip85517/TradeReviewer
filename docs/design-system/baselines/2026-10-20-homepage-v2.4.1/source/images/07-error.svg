<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="07-error.svg"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}</style><rect width="1440" height="1000" fill="#0B1019"/><text x="64" y="52" font-size="24" fill="#E6EDF7" font-weight="600" text-anchor="start">交易库 / 统计</text><text x="64" y="78" font-size="14" fill="#6CA8FF" font-weight="600" text-anchor="start">统计</text><text x="64" y="104" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">读取失败：保留上下文并允许重试</text><rect x="64" y="128" width="1312" height="54" rx="8" fill="#111A26" stroke="#283448"/><text x="88" y="162" font-size="14" fill="#A8B6CB" font-weight="600" text-anchor="start">实盘</text><text x="166" y="162" font-size="14" fill="#E6EDF7" font-weight="600" text-anchor="start">模拟盘</text><path d="M164 178 L222 178" fill="none" stroke="#6CA8FF" stroke-width="2"/><rect x="64" y="198" width="1312" height="58" rx="8" fill="#162233" stroke="#283448"/><text x="88" y="233" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">练习日期</text><rect x="182" y="209" width="190" height="36" rx="8" fill="#111A26" stroke="#283448"/><svg x="190" y="218" width="16" height="16" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 2v4M16 2v4M5 9h14" fill="none" stroke="#E6EDF7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="214" y="233" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">全部</text><text x="406" y="233" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="start">市场：全部</text><text x="552" y="233" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="start">排序：日期 ↓</text><rect x="64" y="278" width="1312" height="388" rx="8" fill="#1B1813" stroke="#76502F"/><text x="88" y="310" font-size="16" fill="#FFC66D" font-weight="600" text-anchor="start">统计读取失败</text><g role="img" aria-label="统计口径：当前市场估值缺失不改变已闭合回合统计；读取失败保留