<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650"><title>首页实测样式样例</title><desc>依据1280乘900浏览器computed样式绘制，非产品截图。字号与颜色限定到具体组件。</desc><rect width="1000" height="650" fill="#0b1220"/><g font-family="Geist, PingFang SC, Microsoft YaHei, sans-serif" fill="#e7edf6"><text x="32" y="40" font-size="22">首页样式样例 · 非产品截图</text><text x="32" y="68" font-size="14" fill="#adbbcf">master 7a5d137d · 1280×900实测 · SVG按实际字号绘制，可打开原尺寸</text><text x="32" y="120" font-size="24" fill="#f1f5fb">我的交易室</text><text x="370" y="120" font-size="14">页面标题 24px / 行高32px</text><text x="32" y="165" font-size="19" fill="#f0f4fb">持仓照看</text><text x="370" y="165" font-size="14">工作区标题 19px / 行高28.5px</text><text x="32" y="205" font-size="13" fill="#e8edf6">持仓总览</text><text x="370" y="205" font-size="14">图表标题 13px / 行高15.6px</text><path d="M32 234H968" stroke="#2a4667"/><rect x="32" y="257" width="100" height="52" fill="#0b1220" stroke="#34445b"/><text x="150" y="278" font-size="14">页面背景 #0b1220</text><text x="150" y="300" font-size="13" fill="#adbbcf">dashboard元素</text><rect x="520" y="257" width="100" height="52" rx="12" fill="#101d31" stroke="#2a4667"/><text x="640" y="278" font-size="14">持仓图表面板 #101d31</text><text x="640" y="300" font-size="13" fill="#adbbcf">边框 #2a4667 · 圆角12px</text><text x="32" y="355" font-size="18">控件样例：各自组件的实际状态，不是全局统一按钮</text><rect x="32" y="380" width="90" height="36" rx="6" fill="#111a2b" stroke="#34445b"/><text x="77" y="403" text-anchor="middle" font-size="14" fill="#91a9c9">筛选</text><text x="32" y="444" font-size="13">页头普通态 · 高36 / 圆角6</text><rect x="350" y="380" width="90" height="36" rx="6" fill="#183246" stroke="#345566"/><text x="395" y="403" text-anchor="middle" font-size="14" fill="#e4f8fa">今年</text><text x="350" y="444" font-size="13">持仓期间选中 · 高36 / 圆角6</text><g opacity=".45"><rect x="700" y="384" width="90" height="28.5" rx="5" fill="#172b44" stroke="#2a4667"/><text x="745" y="403" text-anchor="middle" font-size="11" fill="#53a9ff">上一页</text></g><text x="700" y="444" font-size="13">持仓分页禁用 · opacity .45</text><text x="32" y="494" font-size="14" fill="#adbbcf">焦点：本次未采集完整键盘状态；不虚构outline数值，后续需单独验收。</text><path d="M32 520H968" stroke="#2a4667"/><text x="32" y="554" font-size="13">来源：evidence/computed-styles.json、evidence/computed-controls.json（实时DOM）</text><text x="32" y="580" font-size="13">这些尺寸只适用于标明组件和视口；响应式条件与其它控件见R01–R16。</text><text x="32" y="606" font-size="13">正负结果颜色应以具体组件CSS为准；本图不把全局变量冒充首页所有图表的颜色。</text></g></svg>
