<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>底部贡献交互演示</title><style>
:root{--bg:#0b1019;--surface:#111a26;--raised:#162233;--line:#283448;--text:#e6edf7;--muted:#a8b6cb;--weak:#71829b;--blue:#6ca8ff;--focus:#a9c8ff;--gain:#53d7a0;--loss:#ff8592;--warn:#ffc66d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,"PingFang SC",sans-serif}.shell{width:min(1248px,100%);margin:auto;padding:24px}button{font:inherit;color:inherit;background:var(--raised);border:1px solid var(--line);border-radius:6px;min-height:36px;padding:0 12px;cursor:pointer}button:hover,button:focus-visible,.row-button:focus-visible{border-color:var(--focus);outline:2px solid var(--focus);outline-offset:1px}button.active{background:#243b5c;border-color:var(--blue)}button:disabled{opacity:.45}.meta{color:var(--muted);margin:0 0 8px}.note{color:var(--weak);font-size:12px}.toolbar,.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.spacer{flex:1}.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}.panel-head{display:flex;justify-content:space-between;gap:16px}.panel h2{margin:0;font-size:18px}.summary{color:var(--gain);white-space:nowrap}.summary.warn{color:var(--warn)}.summary.neutral{color:var(--muted)}.context{padding:12px 14px;background:#0f1724;border-left:3px solid var(--blue);color:var(--muted)}.chart{position:relative;display:grid;gap:8px;margin-top:16px;min-height:400px}.chart:before{content:"";position:absolute;left:190px;top:0;bottom:0;border-left:1px solid var(--muted)}.row{display:grid;grid-template-columns:190px minmax(0,1fr) 150px;min-height:46px;align-items:center}.row-button{background:none;border:0;padding:0;text-align:left;border-radius:4px;min-height:34px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.track{height:30px;position:relative}.zero{position:absolute;left:50%;top:0;bottom:0;border-left:1px solid var(--muted)}.bar{height:12px;border-radius:2px;position:absolute;top:9px}.bar.realized{background:var(--gain)}.bar.floating{height:10px;top:15px;border:2px solid var(--blue);background:transparent}.bar.loss{background:var(--loss)}.bar.loss.floating{background:transparent;border-color:var(--loss)}.value{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;position:relative}.value:hover:after,.value:focus-visible:after{content:attr(data-full);position:absolute;right:0;bottom:calc(100% + 4px);z-index:5;background:#243b5c;border:1px solid var(--focus);border-radius:4px;padding:4px 8px;color:var(--text);white-space:nowrap}.legend{color:var(--muted);font-size:12px}.footer{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-top:12px}.error{border:1px solid var(--loss);background:#2a1d27;padding:14px;color:var(--loss)}.empty{padding:80px 20px;text-align:center;color:var(--muted)}.loading{min-height:400px}.loading .row{min-height:46px}.detail{padding:18px;border-left:3px solid var(--blue);background:#0f1724}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:700px){.shell{padding:16px}.row{grid-template-columns:130px minmax(0,1fr) 108px}.chart:before{left:130px}.panel-head{display:block}.summary{display:block;margin-top:8px}}
</style></head><body><main class="shell" data-viewport="1440"><p class="meta">底部贡献设计演示 · 设计画布 1440×1000 / 1280×1000；实际 CSS 视口可切换</p><h1>底部单一贡献区</h1><p class="note">当前表现 → 当前持仓 → 历史统计 → 单一底部贡献。预览不连接业务数据库。</p><section class="source-demo" aria-label="上游来源演示"><div class="legend">上游来源（文档演示控制）</div><div id="sourceControls" class="toolbar"></div><p id="sourceNote" class="note"></p></section><div class="toolbar"><button data-viewport="1440" class="active">1440 画布</button><button data-viewport="1280">1280 画布</button><span class="spacer"></span><button data-mode="current" class="active">当前期间</button><button data-mode="historical">历史已平仓</button></div><div class="controls"><span class="legend">画布外状态演示</span><button data-state="normal">正常</button><button data-state="loading">加载</button><button data-state="empty">空态</button><button data-state="error">异常</button><button data-state="missing">缺估值</button><button data-state="extreme">极值</button><button data-state="mixed-sign">混合正负示例</button></div><section class="panel"><div class="panel-head"><div><h2 id="title"></h2><p id="subtitle" class="meta"></p></div><strong id="total" class="summary"></strong></div><div class="controls"><span class="legend">分类</span><button data-kind="long" class="active">做多</button><button data-kind="short">做空</button><button data-kind="ipo">打新</button><span class="legend">全局市场</span><button data-market="all" class="active">全部</button><button data-market="cn">A股</button><button data-market="hk">港股</button><button data-market="us">美股</button><span class="legend">排序</span><button data-sort="profit" class="active">盈利最高 ↓</button><button data-sort="loss">亏损最大 ↑</button></div><div id="context" class="context"></div><div id="content"></div><div id="footer" class="footer"></div></section></main><script type="module">
import { contributionFixture, getContributionSource } from './contribution-fixture.mjs';
const C=contributionFixture;const S={mode:'current',source:{current:'ytd',historical:'y2026'},kind:'long',market:'all',sort:'profit',state:'normal',page:1,viewport:'1440',drill:null,detail:null,focus:null},M={current:{kind:'long',sort:'profit',page:1,drill:null},historical:{kind:'long',sort:'profit',page:1,drill:null}},seed=contributionFixture.seeds,labels={long:'做多',short:'做空',ipo:'打新'},$=s=>document.querySelector(s);function source(){return getContributionSource(S.mode,S.source[S.mode])}function sourceButtons(){return S.mode==='current'?'<span class="legend">当前表现来源</span><button data-source="ytd" class="'+(S.source.current==='ytd'?'active':'')+'">2026-01-01 — 2026-10-15</button><button data-source="recent" class="'+(S.source.current==='recent'?'active':'')+'">最近 90 天</button>':'<span class="legend">历史年份/区间来源</span><button data-source="y2026" class="'+(S.source.historical==='y2026'?'active':'')+'">2026</button><button data-source="y2025" class="'+(S.source.historical==='y2025'?'active':'')+'">2025</button>'}
function f(v){return S.kind==='short'?(S.mode==='current'?-0.45:-0.35):S.kind==='ipo'?(S.mode==='current'?.2:.12):1}function fmt(v){let n=Math.abs(v),s=v<0?'-':v>0?'+':'';return s+(n>=1e8?(n/1e8).toFixed(2)+'亿':n>=1e4?(n/1e4).toFixed(2)+'万':n.toLocaleString('en-US'))}function full(v){return (v<0?'-':'')+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+' CNY'}function eff(){return S.market!=='all'?S.market:S.drill||'all'}function countFor(){return S.kind==='long'?50:S.kind==='short'?34:12}function allocate(target,weights){let sum=weights.reduce((n,x)=>n+x,0),vals=weights.map(w=>Math.trunc(target*w/sum)),rem=target-vals.reduce((n,x)=>n+x,0);for(let i=0;i<Math.abs(rem);i++)vals[i%vals.length]+=rem>0?1:-1;return vals}function canonicalRows(code){let market=source().markets[code],mult=f(),count=countFor(),base=seed[code],weights=Array.from({length:count},(_,i)=>Math.max(1,base[i%base.length][1])),totals=allocate(Math.round(market.total*mult),weights),realized=allocate(Math.round(market.realized*mult),weights);return totals.map((total,i)=>{let r=realized[i],floating=total-r;return{name:(S.mode==='historical'?'历史回合 · ':'')+base[i%base.length][0]+' · '+String(i+1).padStart(2,'0'),realized:r,floating,total}})}function rows(code){return canonicalRows(code).sort((a,b)=>S.sort==='profit'?b.total-a.total:a.total-b.total)}function result(){let c=source(),ms=Object.keys(c.markets).map(k=>{let rs=canonicalRows(k),total=rs.reduce((n,x)=>n+x.total,0),realized=rs.reduce((n,x)=>n+x.realized,0);return{code:k,name:c.markets[k].name,total,realized,floating:total-realized}}),r=eff()==='all'?[]:rows(eff());return{markets:ms,total:ms.reduce((n,x)=>n+x.total,0),rows:r,count:r.length,pages:Math.max(1,Math.ceil(r.length/8))}}function seg(v,offset,max,type){if(!v)return '';let w=Math.abs(v)/max*48,left=v>=0?50+offset:50-offset-w;return '<span class="bar '+type+(v<0?' loss':'')+'" style="left:'+left+'%;width:'+w+'%;transform:none" title="'+(type==='realized'||S.mode==='historical'?'已实现':'浮盈变化')+' '+full(v)+'"></span>'}function bar(x,max,open){let b=open?'<button class="row-button" data-open-market="'+x.code+'">'+x.name+'</button>':'<button class="row-button" data-open-detail="'+x.name+'">'+x.name+'</button>';let realizedOffset=x.realized<0?0:0,floatingOffset=x.floating<0?Math.abs(Math.min(x.realized,0))/max*48:Math.max(x.realized,0)/max*48;return '<div class="row">'+b+'<span class="track"><span class="zero"></span>'+seg(x.realized,realizedOffset,max,'realized')+(x.floating?seg(x.floating,floatingOffset,max,'floating'):'')+'</span><span class="value" tabindex="0" data-full="'+full(x.total)+'">'+fmt(x.total)+'</span></div>'}
function header(r){let c=source(),g=S.market==='all'?'全部市场':c.markets[S.market].name,l=S.market==='all'&&S.drill?c.markets[S.drill].name:'',scope=l?'局部下钻 '+l:'全局 '+g,st=S.state;$('#title').textContent=st==='error'?'贡献数据读取失败':st==='loading'?'贡献数据加载中':st==='empty'?(S.mode==='current'?'当前期间贡献':'历史已平仓贡献'):st==='missing'?'贡献部分可计算':S.mode==='current'?'当前期间贡献':'历史已平仓贡献';$('#subtitle').textContent=st==='normal'?c.subtitle+(l?' · '+scope:''):c.subtitle+' · '+scope+' · '+labels[S.kind];let currentMarket=r.markets.find(x=>x.code===eff()),realizedScope=S.market==='all'?r.markets.reduce((n,x)=>n+x.realized,0):(currentMarket?currentMarket.realized:0),total=st==='normal'?((S.market==='all'&&!S.drill)?r.total:(currentMarket?currentMarket.total:0)):st==='missing'?(S.mode==='historical'?'历史模式不适用':'已实现 '+fmt(realizedScope)+' · 浮盈不可计算'):st==='empty'?'0 CNY':'—';$('#total').textContent=st==='normal'?fmt(total)+' CNY':total;$('#total').className='summary '+(st==='missing'?'warn':st==='normal'?'':'neutral');$('#context').innerHTML=l?'局部下钻 '+l+' <button id="collapseDrill">返回市场汇总</button>':''}
function render(){let r=result(),st=S.state,co=$('#content'),fo=$('#footer');document.querySelector('.shell').dataset.viewport=S.viewport;document.getElementById(`sourceControls`).innerHTML=sourceButtons();document.getElementById(`sourceNote`).textContent=source().label+`；贡献区复用此来源，不新增日期控件`;document.querySelectorAll('[data-mode],[data-kind],[data-market],[data-sort],[data-viewport]').forEach(b=>b.classList.toggle('active',b.dataset.mode===S.mode||b.dataset.kind===S.kind||b.dataset.market===S.market||b.dataset.sort===S.sort||b.dataset.viewport===S.viewport));header(r);co.innerHTML='';fo.innerHTML='';if(st==='loading'){co.innerHTML='<div class="chart loading">'+Array.from({length:8},()=>'<div class="row"><span>加载中</span><span class="track"><span class="zero"></span><span class="bar realized" style="left:50%;width:28%"></span><span class="bar floating" style="left:50%;width:12%"></span></span><span>—</span></div>').join('')+'</div>';return}if(st==='empty'){co.innerHTML='<div class="empty"><strong>'+(S.mode==='current'?'当前期间贡献无记录':'历史已平仓回合无记录')+'</strong><br>当前过滤结果为 0 项，无分页。</div>';return}if(st==='error'){co.innerHTML='<div class="error"><strong>未能读取贡献数据</strong><br>已保留当前条件与返回上下文。<br><button id="retry">重试</button></div>';return}if(st==='missing'){co.innerHTML='<div class="empty"><strong>'+(S.mode==='historical'?'历史模式不适用':'期间浮盈变化：不可计算')+'</strong><br>'+(S.mode==='historical'?'历史已平仓仅展示已实现贡献，范围由已平仓回合确定。':'当前范围已实现贡献仍为 <span>按当前市场/分类实时派生</span>；缺少估值，不用 0 替代。')+'</div>';return}if(S.detail){let d=S.detail;co.innerHTML='<div class="detail"><strong>证券详情</strong><br>'+d.name+'<br>已实现 <span>'+full(d.realized)+'</span>'+(S.mode==='historical'?'':' · 浮盈变化 <span>'+full(d.floating)+'</span>')+' · 合计 <span>'+full(d.total)+'</span><div class="detail-actions"><button id="closeDetail">关闭并返回贡献</button><button id="copyDetail">复制完整金额</button><button id="exportDetail">导出明细</button></div></div>';return}if(st==='mixed-sign'){let ex=C.mixedSignDemo,mx=Math.max(...ex.map(x=>Math.max(Math.max(x.realized,0)+Math.max(x.floating,0),Math.abs(Math.min(x.realized,0)+Math.min(x.floating,0)))),1);co.innerHTML='<div class="legend">mixed-sign demo fixture; solid/outline components straddle zero line</div><div class="chart">'+ex.map(x=>bar(x,mx,false)).join('')+'</div>';return}if(st==='extreme'){let ex=[{name:'超长证券名称示例 / 000001',realized:900000000,floating:380000000,total:1280000000},{name:'零值持仓 / 000002',realized:0,floating:0,total:0},{name:'亏损样例 / 000003',realized:-6800,floating:0,total:-6800},{name:'第 50 项 / 000050',realized:20,floating:0,total:20}],mx=1280000000;co.innerHTML='<div class="legend">实心：期间已实现　空心：期间浮盈变化　零线居中；极值按钮为独立压力情景</div><div class="chart">'+ex.map(x=>bar(x,mx,false)).join('')+'</div>';return}if(eff()==='all'){let mx=Math.max(...r.markets.map(x=>Math.max(Math.max(x.realized,0)+Math.max(x.floating,0),Math.abs(Math.min(x.realized,0)+Math.min(x.floating,0)))),1);co.innerHTML='<div class="legend">'+(S.mode==='historical'?'实心：期间已实现　零线居中；负值向零线左侧':'实心：期间已实现　空心：期间浮盈变化　零线居中；负值向零线左侧')+'</div><div class="chart">'+r.markets.map(x=>bar(x,mx,true)).join('')+'</div>'}else{let mx=Math.max(...r.rows.map(x=>Math.max(Math.max(x.realized,0)+Math.max(x.floating,0),Math.abs(Math.min(x.realized,0)+Math.min(x.floating,0)))),1),page=r.rows.slice((S.page-1)*8,S.page*8);co.innerHTML='<div class="legend">'+(S.mode==='historical'?'实心：期间已实现 · ':'实心：期间已实现　空心：期间浮盈变化 · ')+r.count+' 条同源明细，市场合计由此集合对账</div><div class="chart">'+page.map(x=>bar(x,mx,false)).join('')+'</div>';fo.innerHTML='<span>'+r.count+' 项 · 每页 8 行</span><span><button id="prev" '+(S.page===1?'disabled':'')+'>‹</button> '+S.page+' / '+r.pages+' <button id="next" '+(S.page===r.pages?'disabled':'')+'>›</button></span>'}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.source){S.source[S.mode]=b.dataset.source;S.state="normal";S.page=1;S.drill=null;S.detail=null;render()}else if(b.dataset.mode){M[S.mode]={kind:S.kind,sort:S.sort,page:S.page,drill:S.drill};S.mode=b.dataset.mode;Object.assign(S,M[S.mode]);S.state='normal';S.detail=null;render()}else if(b.dataset.kind){S.kind=b.dataset.kind;S.page=1;S.detail=null;render()}else if(b.dataset.market){S.market=b.dataset.market;S.page=1;S.detail=null;S.drill=null;render()}else if(b.dataset.sort){S.sort=b.dataset.sort;S.page=1;render()}else if(b.dataset.viewport){S.viewport=b.dataset.viewport;render()}else if(b.dataset.state){S.state=b.dataset.state;S.detail=null;render()}else if(b.id==='collapseDrill'){S.drill=null;S.page=1;S.detail=null;render()}else if(b.dataset.openMarket){if(S.market==='all'){S.drill=b.dataset.openMarket;S.page=1;render()}}else if(b.dataset.openDetail){let list=S.state==='extreme'?[{name:'超长证券名称示例 / 000001',realized:900000000,floating:380000000,total:1280000000},{name:'零值持仓 / 000002',realized:0,floating:0,total:0},{name:'亏损样例 / 000003',realized:-6800,floating:0,total:-6800},{name:'第 50 项 / 000050',realized:20,floating:0,total:20}]:rows(eff()),x=list.find(x=>x.name===b.dataset.openDetail);if(x){S.focus=x.name;S.detail=x;render()}}else if(b.id==='prev'){S.page--;render()}else if(b.id==='next'){S.page++;render()}else if(b.id==='retry'){S.state='normal';render()}else if(b.id==='closeDetail'){S.detail=null;render();setTimeout(()=>{let x=[...document.querySelectorAll('[data-open-detail]')].find(n=>n.dataset.openDetail===S.focus);if(x)x.focus()},0)}else if(b.id==='copyDetail'){navigator.clipboard?.writeText(full(S.detail.total))}else if(b.id==='exportDetail'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.detail)],{type:'application/json'}));a.download='contribution-detail.json';a.click()}});document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row-button')){e.preventDefault();e.target.click()}});window.__HCR05_AUDIT=()=>{let r=result(),checks=Object.fromEntries(r.markets.map(x=>{let d=canonicalRows(x.code).reduce((n,y)=>n+y.total,0);return[x.code,{market:x.total,detail:d,ok:x.total===d}]}));return{mode:S.mode,kind:S.kind,checks,global:r.total===r.markets.reduce((n,x)=>n+x.total,0)}};render();
