<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>交易统计交互演示</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e6edf7;background:#0b1019;color-scheme:dark;font-variant-numeric:tabular-nums}*{box-sizing:border-box}body{margin:0;padding:32px 40px 64px;background:#0b1019}h1{font-size:24px;margin:0 0 4px}.kicker{color:#6ca8ff;font-size:12px}.rail{display:flex;gap:8px;align-items:center;border-bottom:1px solid #283448;padding:16px 0;margin-bottom:18px;flex-wrap:wrap}.grow{flex:1}button{font:inherit;color:inherit;background:#111a26;border:1px solid #33425a;border-radius:6px;height:36px;padding:0 12px;cursor:pointer}button:hover,button[aria-pressed=true],button[aria-pressed=true]{border-color:#6ca8ff;background:#162944}button:focus-visible{outline:2px solid #6ca8ff;outline-offset:2px}.tag{border:1px solid #283448;border-radius:999px;padding:4px 9px;color:#a8b6cb;font-size:12px}.frame{background:#0b1019;border:1px solid #283448;border-radius:8px;overflow:hidden}.frame img{display:block;width:100%;height:auto;max-width:100%}.note,.product{margin-top:16px;padding:12px 14px;border:1px dashed #526d91;color:#c4d4ea;font-size:13px;line-height:20px}.product{border-style:solid;background:#0f1928}.product h2{font-size:18px;margin:0}.sub{font-size:12px;color:#a8b6cb}.mode,.switches{display:flex;gap:8px;flex-wrap:wrap}.mode button,.switches button{height:32px}.surface{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.9fr);gap:16px;margin-top:14px}.trend,.summary,.distribution,.list,.replay{border:1px solid #283448;border-radius:8px;padding:12px;background:#111a26}.trend h3,.summary h3,.distribution h3,.list h3,.replay h3{margin:0 0 8px;font-size:15px}.trend svg{display:block;width:100%;height:220px}.trend .axis{stroke:#283448;stroke-width:1}.trend .line{fill:none;stroke:#6ca8ff;stroke-width:3}.axis-label{fill:#a8b6cb;font-size:10px}.metrics{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.metric{min-width:110px;flex:1;border:1px solid #283448;border-radius:8px;padding:9px}.metric small,.round small{display:block;color:#a8b6cb;font-size:11px}.metric strong{display:block;font-size:19px;margin-top:3px}.distribution{margin-top:14px}.distribution .switches{margin-bottom:10px}.distribution-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.bucket{text-align:left;height:auto;min-height:64px}.bucket strong,.bucket span{display:block}.bucket span{font-size:12px;color:#a8b6cb;margin-top:5px}.list{margin-top:14px}.list-head,.round{display:grid;grid-template-columns:1.1fr .8fr .8fr .8fr .9fr 1fr;gap:8px;align-items:center}.list-head{font-size:11px;color:#a8b6cb;padding:4px 8px}.round{border:1px solid #283448;border-radius:7px;padding:8px;margin-top:6px;font-size:12px}.round button{height:28px;padding:0 8px}.replay{border-color:#6ca8ff;margin-top:14px;background:#111f33}.replay-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.replay-grid div{border:1px solid #33425a;padding:10px;border-radius:6px}.status{font-size:12px;color:#53d7a0;min-height:18px;margin-top:12px}.footer{color:#71839e;font-size:12px;margin-top:26px}@media(max-width:900px){body{padding:20px 16px 40px}.surface{grid-template-columns:1fr}.distribution-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.list-head{display:none}.round{grid-template-columns:1fr 1fr 1fr}.replay-grid{grid-template-columns:1fr}}
</style><style>.metric strong{display:block;font-size:19px;margin-top:3px;white-space:nowrap;cursor:help}.metric strong:focus-visible{outline:2px solid #6ca8ff;outline-offset:3px;border-radius:3px}.summary .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:stretch}.summary .metric{min-width:0;flex:none}.metric-tooltip{position:fixed;z-index:20;max-width:calc(100vw - 16px);padding:6px 8px;border:1px solid #6ca8ff;border-radius:6px;background:#0f1928;color:#e6edf7;font-size:12px;line-height:18px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:none}</style></head><body>
<div class="kicker">交易统计交互演示 · 设计分镜与交互状态演示</div><h1>交易库统计：趋势与盈亏分布下钻</h1><p>参考视口：1440×1000 / 1280×800；上方单帧用于视觉对照，下面是一个连续可操作的统计产品表面。</p>
<nav class="rail" aria-label="统计分镜导航"><button data-frame="01-live-normal.svg" aria-pressed="true">01 实盘正常</button><button data-frame="02-simulation-normal.svg">02 模拟盘正常</button><button data-frame="03-distribution-selected.svg">03 区间选中</button><button data-frame="04-return.svg">04 返回恢复</button><button data-frame="05-loading.svg">05 加载</button><button data-frame="06-empty.svg">06 空态</button><button data-frame="07-error.svg">07 失败</button><button data-frame="08-extreme.svg">08 极值</button><button data-frame="09-missing-input.svg">09 缺失输入</button><span class="grow"></span><span class="tag">操作与状态示例</span></nav>
<main><div id="frame" class="frame"><img id="frame-image" src="frames/01-live-normal.svg" alt="统计页实盘正常状态"></div><div class="note" id="note">实盘按平仓日期统计；范围汇总含净零分母，未平仓排除。</div>
<section class="product" aria-label="统计产品交互演示"><h2>统计产品交互演示</h2><p class="sub">实盘与模拟盘分别保留筛选和返回位置。示例含24个已平仓回合，其中11个盈利。</p><div class="mode"><button data-perspective="live" aria-pressed="true">实盘</button><button data-perspective="simulation">模拟盘</button></div><div id="product-content"></div><div id="product-status" class="status" aria-live="polite"></div></section></main><div class="footer">上方分镜展示视觉状态，下方可体验筛选、分布下钻与返回。</div>
<script>
const notes={'01-live-normal.svg':'正常状态：实盘按平仓日期统计。','02-simulation-normal.svg':'模拟盘：练习记录数与已平仓回合数分开。','03-distribution-selected.svg':'下钻：点击区间展开完整 8 回合列表，可逐行进入复盘。','04-return.svg':'返回：保留选中区间、完整列表、滚动与原触发焦点。','05-loading.svg':'加载：稳定保留图表、轴、摘要与分布空间。','06-empty.svg':'空态：没有已平仓回合。','07-error.svg':'失败：保留条件并允许重试。','08-extreme.svg':'极值：金额与收益率均可计算，不声称缺失输入。','09-missing-input.svg':'缺失：具体字段显示—，说明不可计算集合，不绘制全量分布。'};
const state={perspective:'live',view:'normal'};const viewState={live:{distributionMetric:'returnPct',bucket:null,round:null,returnFocus:null,returnScroll:0},simulation:{distributionMetric:'returnPct',bucket:null,round:null,returnFocus:null,returnScroll:0}};let fixture;
const current=()=>viewState[state.perspective];const money=(n,decimals=0)=>n==null?'—':`${n>0?'+':''}${n.toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals})} CNY`;const compactMoney=(n,decimals=0)=>{if(n==null)return'—';const abs=Math.abs(n),unit=abs>=100000000?'亿':abs>=10000?'万':'',scale=unit==='亿'?100000000:unit==='万'?10000:1;return`${n>0?'+':''}${(n/scale).toLocaleString('en-US',{minimumFractionDigits:unit?2:decimals,maximumFractionDigits:unit?2:decimals})}${unit?` ${unit}`:''} CNY`};const averageNet=(rows,predicate)=>{const values=rows.filter(r=>predicate(r.amount)).map(r=>r.amount);return values.length?values.reduce((s,n)=>s+n,0)/values.length:null};
function roundsFor(p){return p==='simulation'?fixture.rounds:fixture.live.rounds;}
function trendSvg(p){const series=fixture.trend.normal[p],vals=series.map(point=>point.amount),min=Math.min(0,...vals),max=Math.max(0,...vals),span=Math.max(max-min,1),plot={left:30,right:370,top:24,bottom:108},mapY=v=>plot.bottom-((v-min)/span)*(plot.bottom-plot.top),pointX=series.length===1?(plot.left+plot.right)/2:plot.left,points=series.map((point,i)=>`${series.length===1?pointX:plot.left+i*((plot.right-plot.left)/(series.length-1))},${mapY(point.amount).toFixed(2)}`).join(' '),zero=mapY(0).toFixed(2),date=point=>point.date.slice(5),amount=value=>compactMoney(value),marker=series.map((point,i)=>`<circle class="point" cx="${series.length===1?pointX:plot.left+i*((plot.right-plot.left)/(series.length-1))}" cy="${mapY(point.amount).toFixed(2)}" r="5" fill="#6CA8FF"><title>${date(point)} · ${amount(point.amount)}</title></circle>`).join(''),minLabel=min===0?'':`<text class="axis-label" x="2" y="${plot.bottom+4}">${amount(min)}</text>`;return `<svg id="trend-chart" viewBox="0 0 390 150" role="img" aria-label="金额（CNY）趋势" data-plot-left="${plot.left}" data-plot-right="${plot.right}" data-plot-top="${plot.top}" data-plot-bottom="${plot.bottom}" data-trend-dates="${series.map(point=>point.date).join(',')}" data-trend-amounts="${series.map(point=>point.amount).join(',')}"><line class="axis" x1="${plot.left}" y1="${plot.top}" x2="${plot.left}" y2="${plot.bottom}"/><line class="axis" x1="${plot.left}" y1="${zero}" x2="${plot.right}" y2="${zero}"/><line class="axis" x1="${plot.left}" y1="${plot.top}" x2="${plot.right}" y2="${plot.top}"/><line class="axis" x1="${plot.left}" y1="${plot.bottom}" x2="${plot.right}" y2="${plot.bottom}"/><polyline class="line" points="${points}"/>${marker}<text class="axis-label" x="4" y="${plot.top+4}">${amount(max)}</text><text class="axis-label" x="15" y="${Number(zero)+4}">0 CNY</text>${minLabel}${series.map((point,i)=>`<text class="axis-label" x="${series.length===1?pointX:plot.left+i*((plot.right-plot.left)/(series.length-1))}" y="126" text-anchor="middle">${date(point)}</text>`).join('')}<text class="axis-label" x="40" y="16">金额（CNY）</text></svg>`}
function canonicalMetrics(rows){const total=rows.length,wins=rows.filter(r=>r.amount>0).length,pnl=rows.reduce((s,r)=>s+r.amount,0),avgWin=averageNet(rows,r=>r>0),avgLoss=averageNet(rows,r=>r<0);return `<div class="metrics">${state.perspective==='simulation'?'<div class="metric"><small>练习记录</small><strong>8</strong></div>':''}<div class="metric"><small>已平仓回合</small><strong>${total}</strong></div><div class="metric"><small>胜率（盈利/全部）</small><strong>${(wins/total*100).toFixed(1)}%</strong></div><div class="metric"><small>净盈亏</small><strong>${money(pnl)}</strong></div><div class="metric"><small>平均盈利（排除净零）</small><strong>${money(avgWin,2)}</strong></div><div class="metric"><small>平均亏损（排除净零）</small><strong>${money(avgLoss,2)}</strong></div></div>`}
function bucketKey(row,metric){if(metric==='returnPct')return row.category;if(row.amount<-1000)return'loss-gt-50';if(row.amount<0)return'loss-0-50';if(row.amount===0)return'net-zero';if(row.amount<=1000)return'profit-0-50';return'profit-gt-50'}
function distribution(rows){const metric=current().distributionMetric,specs=metric==='amount'?[['亏损 >¥1,000','loss-gt-50'],['亏损 0–¥1,000','loss-0-50'],['净零','net-zero'],['盈利 0–¥1,000','profit-0-50'],['盈利 >¥1,000','profit-gt-50']]:[['亏损 >50%','loss-gt-50'],['亏损 0–50%','loss-0-50'],['净零','net-zero'],['盈利 0–50%','profit-0-50'],['盈利 >50%','profit-gt-50']];const v=current();return `<div class="distribution"><h3>盈亏分布</h3><div class="switches" role="group" aria-label="分布口径"><button data-metric="returnPct" aria-pressed="${metric==='returnPct'}">回合收益率</button><button data-metric="amount" aria-pressed="${metric==='amount'}">金额</button></div><div class="distribution-grid">${specs.map(([label,key])=>{const count=rows.filter(r=>bucketKey(r,metric)===key).length;return `<button class="bucket" data-bucket="${key}" aria-pressed="${v.bucket===key}"><strong>${label}</strong><span>${count} 回合 · ${v.bucket===key?'已选':'查看列表'}</span></button>`}).join('')}</div></div>`}
function list(rows){const v=current(),selected=rows.filter(r=>bucketKey(r,v.distributionMetric)===v.bucket);return `<div class="list" id="round-list"><h3>局部回合列表</h3><p class="sub">完整列表：1–${selected.length} / ${selected.length}（不分页隐藏回合）</p><div class="list-head"><span>身份</span><span>回合</span><span>标的</span><span>收益率</span><span>金额</span><span>操作</span></div>${selected.map(r=>`<div class="round"><span>${r.identity||r.practice}</span><span>回合 ${r.id}</span><span>${r.symbol||fixture.symbol}</span><span>${r.returnPct>0?'+':''}${r.returnPct}%</span><span>${money(r.amount)}</span><button id="round-${r.id}" data-round-id="${r.id}">打开复盘</button></div>`).join('')}</div>`}
function replay(rows){const v=current(),r=rows.find(x=>x.id===v.round),replayData=r?.replay;if(!r||!replayData)return `<div class="replay" id="replay"><h3>复盘不可用</h3><p>当前回合的成交数据不可用，请返回统计后重试。</p><button data-return>返回统计</button></div>`;return `<div class="replay" id="replay"><h3>复盘 · ${r.identity||r.practice} · 回合 ${r.id}</h3><div class="replay-grid"><div><small>标的与日期</small><br>${r.symbol||fixture.symbol} · ${r.date||fixture.date}</div><div><small>成交配对</small><br>${replayData.entry}</div><div><small>本回合上下文</small><br>${replayData.pairs} · ${replayData.unclosed}</div></div><p>本回合 ${r.returnPct>0?'+':''}${r.returnPct}% · ${money(r.amount)} · 已平仓</p><button data-return>返回统计</button></div>`}
function render(){const rows=roundsFor(state.perspective),v=current(),c=document.getElementById('product-content');c.innerHTML=`<div class="surface"><div class="trend"><h3>${state.perspective==='live'?'实盘':'模拟盘'}交易趋势 · 金额</h3>${trendSvg(state.perspective)}</div><div class="summary"><h3>范围汇总</h3><p class="sub">${state.perspective==='live'?'平仓日期口径 · 实盘样例':'练习日期口径 · 练习记录独立'}</p>${metrics(rows)}</div></div>${distribution(rows)}${v.bucket?list(rows):'<p class="sub">请选择一个分布区间查看局部回合列表。</p>'}${v.round?replay(rows):''}`;bind();}
function bind(){const v=current();document.querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click',()=>{v.distributionMetric=b.dataset.metric;render();document.getElementById('product-status').textContent=`已切换盈亏分布为${v.distributionMetric==='amount'?'金额':'回合收益率'}；趋势固定为批准的金额指标。`}));document.querySelectorAll('[data-bucket]').forEach(b=>b.addEventListener('click',()=>{v.bucket=b.dataset.bucket;v.round=null;v.returnFocus=b.id||`bucket-${v.bucket}`;render();document.getElementById('product-status').textContent='已展开当前视角的局部回合列表。'}));document.querySelectorAll('[data-round-id]').forEach(b=>b.addEventListener('click',()=>{v.returnFocus=b.id;v.returnScroll=window.scrollY;v.round=b.dataset.roundId;state.view='replay';render();document.getElementById('product-status').textContent='已进入所点击回合的复盘。'}));document.querySelector('[data-return]')?.addEventListener('click',()=>{const focusId=v.returnFocus,scroll=v.returnScroll;v.round=null;state.view='list';render();requestAnimationFrame(()=>{window.scrollTo(0,scroll);document.getElementById(focusId)?.focus();});document.getElementById('product-status').textContent='已返回统计，区间、滚动和原触发焦点保持。'});}
document.querySelectorAll('[data-perspective]').forEach(b=>b.addEventListener('click',()=>{state.perspective=b.dataset.perspective;document.querySelectorAll('[data-perspective]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));document.querySelectorAll('[data-frame]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.frame;document.getElementById('frame-image').src='frames/'+n;document.getElementById('frame-image').alt=b.textContent;document.getElementById('note').textContent=notes[n];document.querySelectorAll('[data-frame]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
const originalNotes=notes;
const auditNote=document.createElement('p');auditNote.className='sub note';auditNote.textContent='计算示例：税费前 / 费用 / 净盈亏 A-01：+1,020 / 20 / +1,000；E-02：-880 / 20 / -900；H-02：+20 / 20 / 0。';document.querySelector('.product').after(auditNote);
state.scenario='normal';
function syncPerspectiveButtons(){document.querySelectorAll('[data-perspective]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.perspective===state.perspective)));}
const scenarioRows=()=>state.scenario==='extreme'?fixture.extreme.live.rounds:state.scenario==='missingInput'?fixture.missingInput.rows:roundsFor(state.perspective);
const scenarioTrend=p=>state.scenario==='extreme'?fixture.trend.extreme:state.scenario==='missingInput'?[]:fixture.trend.normal[p];
const safePercent=n=>n==null?'—':`${n>0?'+':''}${n}%`;
const safeMoney=n=>n==null?'—':money(n);
function trendSvg(p){const series=scenarioTrend(p),vals=series.map(point=>point.amount),min=Math.min(0,...vals),max=Math.max(0,...vals),span=Math.max(max-min,1),plot={left:30,right:370,top:24,bottom:108},mapY=v=>plot.bottom-((v-min)/span)*(plot.bottom-plot.top),pointX=series.length===1?(plot.left+plot.right)/2:plot.left,points=series.map((point,i)=>`${series.length===1?pointX:plot.left+i*((plot.right-plot.left)/(series.length-1))},${mapY(point.amount).toFixed(2)}`).join(' '),zero=mapY(0).toFixed(2),amount=value=>compactMoney(value),marker=series.map((point,i)=>`<circle class="point" cx="${series.length===1?pointX:plot.left+i*((plot.right-plot.left)/(series.length-1))}" cy="${mapY(point.amount).toFixed(2)}" r="5" fill="#6CA8FF"><title>${point.date.slice(5)} · ${amount(point.amount)}</title></circle>`).join('');return `<svg id="trend-chart" viewBox="0 0 390 150" role="img" aria-label="金额（CNY）趋势" data-trend-dates="${series.map(point=>point.date).join(',')}" data-trend-amounts="${series.map(point=>point.amount).join(',')}"><line class="axis" x1="30" y1="24" x2="30" y2="108"/><line class="axis" x1="30" y1="${zero}" x2="370" y2="${zero}"/><line class="axis" x1="30" y1="24" x2="370" y2="24"/><line class="axis" x1="30" y1="108" x2="370" y2="108"/><polyline class="line" points="${points}"/>${marker}<text class="axis-label" x="4" y="28">${series.length?amount(max):'不可计算'}</text><text class="axis-label" x="15" y="${Number(zero)+4}">0 CNY</text>${series.map((point,i)=>`<text class="axis-label" x="${series.length===1?pointX:30+i*((340)/(series.length-1))}" y="126" text-anchor="middle">${point.date.slice(5)}</text>`).join('')}<text class="axis-label" x="40" y="16">金额（CNY）</text></svg>`}
function legacyMetrics(rows){if(state.scenario==='missingInput')return `<div class="metrics"><div class="metric"><small>缺失回合</small><strong>${rows.length}</strong></div><div class="metric"><small>胜率（盈利/全部）</small><strong>—</strong></div><div class="metric"><small>净盈亏</small><strong>—</strong></div></div><p class="sub">缺少平仓估值（exitPrice），金额与收益率不可计算。</p>`;const total=rows.length,wins=rows.filter(r=>r.amount>0).length,pnl=rows.reduce((s,r)=>s+r.amount,0),avgWin=averageNet(rows,r=>r>0),avgLoss=averageNet(rows,r=>r<0);return `<div class="metrics">${state.perspective==='simulation'?'<div class="metric"><small>练习记录</small><strong>8</strong></div>':''}<div class="metric"><small>已平仓回合</small><strong>${total}</strong></div><div class="metric"><small>胜率（盈利/全部）</small><strong>${(wins/total*100).toFixed(1)}%</strong></div><div class="metric"><small>净盈亏</small><strong>${money(pnl)}</strong></div><div class="metric"><small>平均盈利（排除净零）</small><strong>${money(avgWin,2)}</strong></div><div class="metric"><small>平均亏损（排除净零）</small><strong>${money(avgLoss,2)}</strong></div></div>`}
function distribution(rows){if(state.scenario==='missingInput')return `<div class="distribution"><h3>盈亏分布</h3><div class="switches" role="group" aria-label="分布口径"><button data-metric="returnPct" disabled aria-disabled="true">回合收益率</button><button data-metric="amount" disabled aria-disabled="true">金额</button></div><p class="sub">当前集合缺少 exitPrice；不可计算指标已禁用，不绘制全量分布。</p></div>`;const metric=current().distributionMetric,specs=metric==='amount'?[['亏损 >¥1,000','loss-gt-50'],['亏损 0–¥1,000','loss-0-50'],['净零','net-zero'],['盈利 0–¥1,000','profit-0-50'],['盈利 >¥1,000','profit-gt-50']]:[['亏损 >50%','loss-gt-50'],['亏损 0–50%','loss-0-50'],['净零','net-zero'],['盈利 0–50%','profit-0-50'],['盈利 >50%','profit-gt-50']];const v=current();return `<div class="distribution"><h3>盈亏分布</h3><div class="switches" role="group" aria-label="分布口径"><button data-metric="returnPct" aria-pressed="${metric==='returnPct'}">回合收益率</button><button data-metric="amount" aria-pressed="${metric==='amount'}">金额</button></div><div class="distribution-grid">${specs.map(([label,key])=>{const count=rows.filter(r=>bucketKey(r,metric)===key).length;return `<button class="bucket" data-bucket="${key}" aria-pressed="${v.bucket===key}"><strong>${label}</strong><span>${count} 回合 · ${v.bucket===key?'已选':'查看列表'}</span></button>`}).join('')}</div></div>`}
function list(rows){const v=current(),selected=state.scenario==='missingInput'?rows:rows.filter(r=>bucketKey(r,v.distributionMetric)===v.bucket);return `<div class="list" id="round-list"><h3>${state.scenario==='missingInput'?'缺失输入回合':'局部回合列表'}</h3><p class="sub">完整列表：1–${selected.length} / ${selected.length}（不分页隐藏回合）</p><div class="list-head"><span>身份</span><span>回合</span><span>标的</span><span>收益率</span><span>金额</span><span>操作</span></div>${selected.map(r=>`<div class="round"><span>${r.identity||r.practice||'缺失输入'}</span><span>回合 ${r.id}</span><span>${r.symbol||fixture.symbol}</span><span>${safePercent(r.returnPct)}</span><span>${safeMoney(r.amount)}</span><button id="round-${r.id}" data-round-id="${r.id}">打开复盘</button></div>`).join('')}</div>`}
function replay(rows){const v=current(),r=rows.find(x=>x.id===v.round),replayData=r?.replay;if(!r||!replayData)return `<div class="replay" id="replay"><h3>复盘不可用</h3><p>当前回合的成交数据不可用，请返回统计后重试。</p><button data-return>返回统计</button></div>`;const missing=state.scenario==='missingInput';return `<div class="replay" id="replay"><h3>复盘 · ${r.identity||r.practice||'缺失输入'} · 回合 ${r.id}</h3><div class="replay-grid"><div><small>标的与日期</small><br>${r.symbol||fixture.symbol} · ${r.date||fixture.date}</div><div><small>成交配对</small><br>${replayData.entry}</div><div><small>本回合上下文</small><br>${replayData.pairs} · ${replayData.unclosed}</div></div><p>本回合 ${missing?'收益率 — · 金额 — · 不可计算':`${safePercent(r.returnPct)} · ${safeMoney(r.amount)} · 已平仓`}</p><button data-return>返回统计</button></div>`}
function render(){syncPerspectiveButtons();const rows=scenarioRows(),v=current(),label=state.scenario==='extreme'?'极值实盘':state.scenario==='missingInput'?'缺失输入模拟盘':state.perspective==='live'?'实盘':'模拟盘';document.getElementById('product-content').innerHTML=`<div class="surface"><div class="trend"><h3>${label}交易趋势 · 金额</h3>${trendSvg(state.perspective)}</div><div class="summary"><h3>范围汇总</h3><p class="sub">${state.scenario==='extreme'?'极值数据已载入 · 可计算':state.scenario==='missingInput'?'缺少平仓估值 · 金额与收益率不可计算':state.perspective==='live'?'平仓日期口径 · 实盘样例':'练习日期口径 · 练习记录独立'}</p>${metrics(rows)}</div></div>${distribution(rows)}${v.bucket?list(rows):'<p class="sub">请选择一个分布区间查看局部回合列表。</p>'}${v.round?replay(rows):''}`;bind();}
function bind(){const v=current();document.querySelectorAll('[data-metric]:not([disabled])').forEach(b=>b.addEventListener('click',()=>{v.distributionMetric=b.dataset.metric;render()}));document.querySelectorAll('[data-bucket]').forEach(b=>b.addEventListener('click',()=>{v.bucket=b.dataset.bucket;v.round=null;v.returnFocus=b.id||`bucket-${v.bucket}`;render()}));document.querySelectorAll('[data-round-id]').forEach(b=>b.addEventListener('click',()=>{v.returnFocus=b.id;v.returnScroll=window.scrollY;v.round=b.dataset.roundId;render()}));document.querySelector('[data-return]')?.addEventListener('click',()=>{const focusId=v.returnFocus,scroll=v.returnScroll;v.round=null;render();requestAnimationFrame(()=>{window.scrollTo(0,scroll);document.getElementById(focusId)?.focus();});});bindMetricTooltips();}
document.querySelectorAll('[data-frame]').forEach(b=>b.addEventListener('click',()=>{const n=b.dataset.frame;state.scenario=n==='08-extreme.svg'?'extreme':n==='09-missing-input.svg'?'missingInput':'normal';if(n==='01-live-normal.svg'||state.scenario==='extreme')state.perspective='live';if(n==='02-simulation-normal.svg'||state.scenario==='missingInput')state.perspective='simulation';const v=current();v.round=null;v.returnFocus=null;v.returnScroll=0;v.bucket=state.scenario==='extreme'?'profit-gt-50':state.scenario==='missingInput'?'missing':null;render();}));
document.querySelectorAll('[data-perspective]').forEach(b=>b.addEventListener('click',()=>{state.perspective=b.dataset.perspective;state.scenario='normal';const v=current();v.round=null;v.returnFocus=null;v.returnScroll=0;v.bucket=null;state.view='normal';render();}));
function validateCanonicalFixture(data){const sets=[['simulation',data.rounds],['live',data.live?.rounds]];for(const [name,rows] of sets){if(!Array.isArray(rows)||rows.length!==24)throw new Error(`${name} 必须有 24 个回合`);const missing=rows.filter(r=>!r.replay||!r.replay.entry||!r.replay.pairs||r.replay.unclosed===undefined);if(missing.length)throw new Error(`${name} 缺少 replay：${missing.map(r=>r.id).join(',')}`)}if(data.trend?.metric!=='amount'||data.trend?.aggregation!=='sumByDate')throw new Error('trend 必须是金额按日期聚合');for(const name of ['live','simulation']){const series=data.trend.normal?.[name];const rows=name==='live'?data.live.rounds:data.rounds;const dates=[...new Set(rows.map(row=>row.date||data.date))].sort();if(JSON.stringify(series?.map(point=>point.date))!==JSON.stringify(dates))throw new Error(`${name} trend 日期集合与回合不一致`);if(series.reduce((sum,point)=>sum+point.amount,0)!==rows.reduce((sum,row)=>sum+row.amount,0))throw new Error(`${name} trend 金额合计与回合不一致`)}}
function validateSpecialRows(data){const extreme=data.extreme?.live?.rounds;if(!Array.isArray(extreme)||extreme.length!==1||extreme[0].id!=='EXTREME-01'||extreme[0].amount==null||extreme[0].returnPct==null||!extreme[0].replay?.entry||!extreme[0].replay?.pairs||extreme[0].replay.unclosed===undefined)throw new Error('extreme fixture 必须保留 EXTREME-01 的完整可计算 replay');const missing=data.missingInput?.rows;if(!Array.isArray(missing)||missing.length!==2||missing.some(row=>row.amount!==null||row.returnPct!==null||!row.missingInputs?.includes('exitPrice')||!row.replay?.entry||!row.replay?.pairs||row.replay.unclosed===undefined))throw new Error('missingInput fixture 必须保留两条 exitPrice 缺失且完整的 replay');if(!Array.isArray(data.trend?.extreme)||data.trend.extreme.reduce((sum,point)=>sum+point.amount,0)!==extreme.reduce((sum,row)=>sum+row.amount,0))throw new Error('extreme trend 必须与 EXTREME-01 金额一致');const extremeDates=[...new Set(extreme.map(row=>row.date))].sort();const trendDates=[...new Set(data.trend.extreme.map(point=>point.date))].sort();if(JSON.stringify(extremeDates)!==JSON.stringify(trendDates))throw new Error('extreme trend 日期集合必须与 EXTREME-01 回合日期一致');}
function validateFixture(data){validateCanonicalFixture(data);validateSpecialRows(data);const samples=data.pnlAudit?.samples||[];if(data.pnlAudit?.netField!=='amount'||samples.length<3||!samples.some(s=>s.netAmount===0)||samples.some(s=>s.grossAmount-s.feeAmount!==s.netAmount))throw new Error('pnlAudit 必须提供可核对的税费前/费用/净盈亏样例，且包含净零');}
fetch('fixture.json').then(r=>r.json()).then(data=>{validateFixture(data);fixture=data;render()}).catch(error=>{document.getElementById('product-content').textContent=`fixture 加载失败：${error.message}`});
const metricStrong=(display,full=display)=>`<strong tabindex="0" title="${full}" aria-label="${full}" aria-describedby="metric-tooltip" data-full-value="${full}">${display}</strong>`;
function metrics(rows){if(state.scenario==='missingInput')return `<div class="metrics"><div class="metric"><small>缺失回合</small>${metricStrong(rows.length)}</div><div class="metric"><small>胜率（盈利/全部）</small>${metricStrong('—')}</div><div class="metric"><small>净盈亏</small>${metricStrong('—')}</div></div><p class="sub">缺少平仓估值（exitPrice），金额与收益率不可计算。</p>`;const total=rows.length,wins=rows.filter(r=>r.amount>0).length,pnl=rows.reduce((s,r)=>s+r.amount,0),avgWin=averageNet(rows,r=>r>0),avgLoss=averageNet(rows,r=>r<0);return `<div class="metrics">${state.perspective==='simulation'?'<div class="metric"><small>练习记录</small>'+metricStrong('8')+'</div>':''}<div class="metric"><small>已平仓回合</small>${metricStrong(total)}</div><div class="metric"><small>胜率（盈利/全部）</small>${metricStrong((wins/total*100).toFixed(1)+'%')}</div><div class="metric"><small>净盈亏</small>${metricStrong(compactMoney(pnl),money(pnl,2))}</div><div class="metric"><small>平均盈利（排除净零）</small>${metricStrong(compactMoney(avgWin,2),money(avgWin,2))}</div><div class="metric"><small>平均亏损（排除净零）</small>${metricStrong(compactMoney(avgLoss,2),money(avgLoss,2))}</div></div>`}
function showMetricTooltip(target){let tip=document.getElementById('metric-tooltip');if(!tip){tip=document.createElement('div');tip.id='metric-tooltip';tip.className='metric-tooltip';tip.role='tooltip';document.body.append(tip)}tip.textContent=target.dataset.fullValue;tip.hidden=false;const box=target.getBoundingClientRect();const left=Math.min(Math.max(8,box.left),Math.max(8,window.innerWidth-tip.offsetWidth-8));const top=Math.min(box.bottom+8,Math.max(8,window.innerHeight-tip.offsetHeight-8));tip.style.left=`${left}px`;tip.style.top=`${top}px`}
function hideMetricTooltip(){const tip=document.getElementById('metric-tooltip');if(tip)tip.hidden=true}
function bindMetricTooltips(){document.querySelectorAll('.metric strong[data-full-value]').forEach(target=>{target.addEventListener('focus',()=>showMetricTooltip(target));target.addEventListener('blur',hideMetricTooltip);target.addEventListener('keydown',event=>{if(event.key==='Escape'){hideMetricTooltip();target.blur()}})})}
</script></body></html>
