<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit;color:inherit}button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.app{min-height:100vh;background:var(--bg)}
.sidebar{position:fixed;inset:0 auto 0 0;width:72px;background:var(--nav);display:flex;flex-direction:column;align-items:center;z-index:4}.brand{height:64px;width:72px;display:grid;place-items:center;color:var(--text);font-size:20px;font-weight:700;letter-spacing:-.04em}.global-nav{display:flex;flex-direction:column;gap:8px;align-items:center}.nav-item{width:56px;height:56px;border:0;border-radius:8px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;cursor:pointer}.nav-item svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.nav-item span{font-size:12px;line-height:16px}.nav-item.active{background:#1c2b42;color:var(--text)}
.header{position:fixed;top:0;left:72px;right:0;height:64px;background:var(--bg);border-bottom:1px solid #243348;display:flex;align-items:center;padding:0 24px;z-index:3}.header h1{margin:0;font-size:18px;font-weight:650}.header .context{margin-left:14px;color:var(--muted)}.header .spacer{flex:1}.header .date{color:var(--muted);font-size:12px}
.main{margin-left:72px;min-height:100vh;padding-top:64px;background:var(--bg);position:relative}.subnav{height:58px;display:flex;align-items:center;gap:18px;padding:0 24px;border-bottom:1px solid #25364b;background:var(--bg)}.subnav .mode-group,.subnav .page-group{display:flex;gap:6px}.subnav button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:7px;padding:7px 12px;cursor:pointer}.subnav button.active{color:var(--text);background:#1b385a;border-color:#406a9c}.content{padding:20px 24px 88px;max-width:1400px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;box-shadow:var(--shadow)}#content>.panel+.panel{margin-top:18px}.app[data-mode=simulation] .main,.app[data-mode=simulation] .subnav{background:#111e2c}.app[data-mode=simulation] .main:before{content:"";position:absolute;inset:64px 0 0;border:1px solid #50698433;border-top:2px solid #6f8aa644;pointer-events:none}.app[data-mode=simulation] .panel{background:var(--panel-sim)}
.section-head{display:flex;align-items:center;gap:8px;margin-bottom:14px}.section-head h2,.section-head h3{font-size:14px;margin:0;font-weight:650}.section-head .meta{margin-left:auto;color:var(--muted);font-size:12px}.measure-group{display:flex;gap:4px;margin-left:10px}.measure-group button{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:5px;padding:4px 7px;cursor:pointer}.measure-group button.active{color:var(--text);background:#1b385a;border-color:#406a9c}.help-wrap{position:relative;display:inline-flex;vertical-align:middle}.help-icon{width:36px;height:36px;padding:10px;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--blue);cursor:pointer}.help-icon svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.help-popover{position:absolute;z-index:8;top:calc(100% + 8px);left:0;width:250px;padding:10px 12px;border:1px solid #4e6b8e;border-radius:8px;background:#17263a;color:var(--text);font-size:12px;line-height:1.55;box-shadow:0 12px 28px #03070dcc}.help-popover[hidden]{display:none}.help-popover.right{left:auto;right:0}.compare .help-popover{top:auto;bottom:calc(100% + 8px);left:0}.compare{position:fixed;left:72px;right:0;bottom:0;height:52px;background:#0d1724eF;border-top:1px solid #2d425b;display:flex;align-items:center;justify-content:center;gap:12px;z-index:5}.compare .toolbar-label{color:var(--muted);font-size:12px}.compare select{background:#17263a;color:var(--text);border:1px solid #4a617d;border-radius:6px;padding:5px 28px 5px 8px}.compare .help-label{color:var(--muted);font-size:12px;cursor:default}
.metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.metric{min-height:92px;border:1px solid #2d4058;border-radius:8px;padding:12px;background:#0f1824}.metric-label{display:flex;align-items:center;gap:2px;color:var(--muted);font-size:12px}.metric-value{display:block;margin-top:12px;font-size:21px;letter-spacing:-.02em}.metric-value.positive{color:var(--green)}.metric-value.negative{color:var(--red)}.metric-value.neutral{color:var(--text)}.demo-message{margin:14px 0 0;color:var(--muted);display:flex;align-items:center;gap:3px}.demo-message strong{color:var(--text);font-weight:600}.table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse}.data-table th,.data-table td{text-align:left;padding:10px 12px;border-bottom:1px solid #25364b;white-space:nowrap}.data-table th{font-size:12px;color:var(--muted);font-weight:500}.data-table td.num{text-align:right}.data-table td.green{color:var(--green)}.data-table td.red{color:var(--red)}.empty,.loading{padding:34px 0;color:var(--muted);text-align:center}.chart{height:230px;position:relative;border:1px solid #2d4058;border-radius:8px;background:#0c141f;overflow:hidden}.chart svg{width:100%;height:100%}.chart .axis{stroke:#334a63;stroke-width:1}.chart .zero{stroke:#667b92;stroke-dasharray:4 5}.chart .line{fill:none;stroke:var(--blue);stroke-width:2.5}.chart .point{fill:var(--blue2)}.bars{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:180px;gap:20px;padding:18px 36px 12px;border:1px solid #2d4058;border-radius:8px;background:#0c141f}.bar{border-radius:4px 4px 1px 1px;min-height:8px}.bar.loss{background:var(--red)}.bar.win{background:var(--green)}.bar.neutral{background:#78879c}.bar-labels{display:grid;grid-template-columns:repeat(5,1fr);gap:20px;padding:6px 36px 0;color:var(--muted);font-size:11px;text-align:center}.filters{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-bottom:14px}.filters select{background:#17263a;color:var(--text);border:1px solid #283448;border-radius:6px;padding:7px 9px}
@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.content{padding-left:16px;padding-right:16px}.header{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div id="app" class="app" data-mode="live">

<button class="nav-item active" data-nav="library" aria-label="交易库"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM8 7h8M8 11h8M8 15h5"/></svg><span>交易库</span></button>
<button class="nav-item" data-nav="analysis" aria-label="分析"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18M6 16l5-6 4 3 6-8"/></svg><span>分析</span></button>
<button class="nav-item" data-nav="data" aria-label="数据"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6c0-4 18-4 18 0v12c0 4-18 4-18 0zM3 6c0 4 18 4 18 0M3 12c0 4 18 4 18 0"/></svg><span>数据</span></button>
<button class="nav-item" data-nav="strategy" aria-label="策略"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v18M6 7h8a4 4 0 0 1 4 4v6M15 14l3 3 3-3"/></svg><span>策略</span></button>
</nav></aside>
<header class="header"><h1 id="heading">实盘交易</h1><span class="context">交易库 · E visual sample</span><span class="spacer"></span><span class="date" id="header-date"></span></header>
<main class="main"><div class="subnav"><div class="mode-group" id="mode-controls"></div><div class="page-group" id="page-controls"></div></div><div id="content" class="content"></div></main>
<div class="compare" aria-label="原型工具"><span class="toolbar-label">预览</span><select id="preview-select" aria-label="预览状态"><option value="normal">正常</option><option value="loading">加载中</option><option value="empty">空状态</option></select><span class="help-wrap" id="prototype-help"><span class="help-label">口径说明</span><button class="help-icon" type="button" aria-label="口径说明" aria-expanded="false" aria-describedby="prototype-help-popover"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4M8 4.8h.01"/></svg></button><span class="help-popover" id="prototype-help-popover" role="tooltip" hidden>这是 E 视觉样本。数据来自固定 fixture，日期切换只改变当前展示口径；重置页面即恢复实盘、交易列表与正常预览。真实产品接入后将由服务端数据替换。</span></span></div>
</div>
<script>
const fixtures={live:{label:'实盘',heading:{list:'实盘交易',stats:'实盘统计'},dates:{list:'2026-10-01 至 2026-10-15',stats:'2026-10-01 至 2026-10-15'},dateLabels:{list:'成交日期',stats:'平仓日期'},account:'全部账户',metrics:[['有效回合','5'],['累计净盈亏','747.14'],['胜率','60.00%'],['平均盈利','351.88'],['平均亏损','-154.25'],['费用（已扣除）','22.86']],trend:[['10-03',48],['10-05',-4],['10-07',905.64],['10-09',1003.64],['10-12',747.14]],distribution:[['亏损 > 5%',1,'loss','20.00%'],['亏损 0–5%',1,'loss','20.00%'],['持平',0,'','0.00%'],['盈利 0–5%',2,'win','40.00%'],['盈利 > 5%',1,'win','20.00%']],distributionAmount:[['亏损 > 100',1,'loss','20.00%'],['亏损 0–100',1,'loss','20.00%'],['持平',0,'','0.00%'],['盈利 0–100',2,'win','40.00%'],['盈利 > 100',1,'win','20.00%']],rows:[['2026-10-02','招商银行','600036','买入','10','100.00','1.00','已复盘'],['2026-10-03','招商银行','600036','卖出','10','105.00','1.00','已复盘'],['2026-10-03','贵州茅台','600519','买入','100','1712.00','8.56','待复盘'],['2026-10-04','平安银行','000001','买入','10','100.00','1.00','已复盘'],['2026-10-05','平安银行','000001','卖出','10','95.00','1.00','已复盘'],['2026-10-07','贵州茅台','600519','卖出','40','1735.00','6.94','待复盘'],['2026-10-08','立讯精密','002475','买入','10','100.00','1.00','已复盘'],['2026-10-09','立讯精密','002475','卖出','10','110.00','1.00','已复盘'],['2026-10-09','宁德时代','300750','买入','50','219.00','3.29','已复盘'],['2026-10-12','宁德时代','300750','卖出','50','214.00','3.21','待复盘'],['2026-10-15','中芯国际','688981','买入','80','92.00','2.95','已复盘']]},simulation:{label:'模拟盘',heading:{list:'模拟盘练习',stats:'模拟盘统计'},dates:{list:'2026-10-15 至 2026-10-19',stats:'2026-10-15 至 2026-10-19'},dateLabels:{list:'练习保存日期',stats:'练习保存日期'},account:'模拟练习身份 · 不显示实盘账户',metrics:[['有效回合','7'],['累计净盈亏','2,272.00'],['总体胜率','71.43%'],['费用（已扣除）','33.00'],['做多胜率 · 5/7 样本','71.43%'],['做空胜率 · 无样本','—'],['平均盈利','490.80'],['平均亏损','-91.00']],trend:[['10-15',1982],['10-16',2336],['10-17',2258],['10-18',2154],['10-19',2272]],distribution:[['亏损 > 5%',0,'loss','0.00%'],['亏损 0–5%',2,'loss','28.57%'],['持平',0,'','0.00%'],['盈利 0–5%',1,'win','14.29%'],['盈利 > 5%',4,'win','57.14%']],distributionAmount:[['亏损 > 100',1,'loss','14.29%'],['亏损 0–100',1,'loss','14.29%'],['持平',0,'','0.00%'],['盈利 0–100',1,'win','14.29%'],['盈利 > 100',4,'win','57.14%']],exercises:[['2026-10-15','练习 A','贵州茅台','600519','3','2','70'],['2026-10-15','练习 E','贵州茅台','600519','2','1','0'],['2026-10-16','练习 C','平安银行','000001','2','1','0'],['2026-10-17','练习 D','宁德时代','300750','2','1','0'],['2026-10-18','练习 B','贵州茅台','600519','2','1','0'],['2026-10-19','练习 F','招商银行','600036','2','1','0']]}};
const q=new URLSearchParams(location.search);const state={mode:'live',page:'list',preview:'normal',measure:'rate',date:{live:'fixture',simulation:'fixture'}};const app=document.getElementById('app');const content=document.getElementById('content');
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function help(id,label,body,extra=''){return `<span class="help-wrap ${extra}" id="${id}"><span class="help-label">${label}</span><button class="help-icon" type="button" aria-label="${label}" aria-expanded="false" aria-describedby="${id}-popover"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.2v4M8 4.8h.01"/></svg></button><span class="help-popover" id="${id}-popover" role="tooltip" hidden>${body}</span></span>`}
function current(){return fixtures[state.mode]}
function modeControls(){return `<button data-mode="live" class="${state.mode==='live'?'active':''}">实盘</button><button data-mode="simulation" class="${state.mode==='simulation'?'active':''}">模拟盘</button>`}
function pageControls(){return `<button data-page="list" class="${state.page==='list'?'active':''}">交易列表</button><button data-page="stats" class="${state.page==='stats'?'active':''}">统计分析</button>`}
function filters(c){return `<div class="filters"><label>${c.dateLabels[state.page]} <select data-date><option value="fixture">${c.dates[state.page]}</option></select></label><label>账户 <select><option>${c.account}</option></select></label></div>`}
function list(c){return `<section class="panel"><div class="section-head"><h2>交易回合</h2><span class="meta">${c.exercises.length} 个固定样例</span></div>${filters(c)}<div class="table-wrap"><table class="data-table"><thead><tr><th>日期</th><th>练习</th><th>标的</th><th>代码</th><th>交易数</th><th>胜负</th><th>净盈亏</th></tr></thead><tbody>${c.exercises.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td class="num ${Number(r[6])<0?'red':Number(r[6])>0?'green':''}">${r[6]}</td></tr>`).join('')}</tbody></table></div></section>`}
function metricClass(label,value){if(!['累计净盈亏','平均盈利','平均亏损'].includes(label))return 'neutral';const n=Number(String(value).replace(/,/g,''));return n<0?'negative':n>0?'positive':'neutral'}
function stats(c){const metrics=c.metrics.map(m=>`<div class="metric"><div class="metric-label">${m[0]}${m[0].includes('费用')?help('fee-help','费用口径','已平仓回合的开仓分摊费与平仓费；已计入净盈亏，不含未平仓费用。'):''}</div><strong class="metric-value ${metricClass(m[0],m[1])}">${m[1]}</strong></div>`).join('');const draw=state.mode==='simulation'?`<p class="demo-message"><strong>最差练习回撤</strong> — ${help('drawdown-help','回撤说明','定义为所选练习中最大的单次权益回撤。当前样例缺少权益路径，因此保留 —，不编造数值。')}</p>`:'';const measureControls=`<span class="measure-group"><button data-measure="rate" class="${state.measure==='rate'?'active':''}">比例</button><button data-measure="amount" class="${state.measure==='amount'?'active':''}">金额</button></span>`;const trend=c.trend;const min=Math.min(...trend.map(d=>d[1]),0),max=Math.max(...trend.map(d=>d[1]),1),range=max-min;const points=trend.map((d,i)=>`${i*(100/(trend.length-1))},${100-(d[1]-min)/range*80-10}`).join(' ');const bars=c.distribution.map(d=>`<div class="bar ${d[2]}" style="height:${Math.max(8,d[1]/Math.max(...c.distribution.map(x=>x[1]))*100)}%" title="${d[0]} ${d[3]}"></div>`).join('');return `<section class="panel"><div class="section-head"><h2>统计概览</h2><span class="meta">${c.dates.stats}</span>${measureControls}</div><div class="metrics">${metrics}</div>${draw}</section><section class="panel"><div class="section-head"><h3>累计净盈亏趋势</h3>${help('trend-help','趋势说明','按当前日期范围绘制固定样例的累计净盈亏序列。')}<span class="meta">${state.measure==='amount'?'金额':'比例'}</span></div><div class="chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="累计净盈亏趋势"><path class="axis" d="M0 90H100M0 10V90"/><path class="zero" d="M0 50H100"/><polyline class="line" points="${points}"/>${trend.map((d,i)=>`<circle class="point" cx="${i*(100/(trend.length-1))}" cy="${100-(d[1]-min)/range*80-10}" r="1.3"/>`).join('')}</svg></div></section><section class="panel"><div class="section-head"><h3>盈亏分布</h3>${help('distribution-help','分布说明','按当前范围统计回合数；盈利为绿、亏损为红，持平保持中性。')}</div><div class="bars">${bars}</div><div class="bar-labels">${c.distribution.map(d=>`<span>${d[0]}</span>`).join('')}</div></section>`}
function render(){const c=current();app.dataset.mode=state.mode;document.getElementById('mode-controls').innerHTML=modeControls();document.getElementById('page-controls').innerHTML=pageControls();document.getElementById('heading').textContent=c.heading[state.page];document.getElementById('header-date').textContent=c.dates[state.page];if(state.preview==='loading'){content.innerHTML='<section class="panel"><div class="loading">正在加载固定样例…</div></section>'}else if(state.preview==='empty'){content.innerHTML='<section class="panel"><div class="empty">当前筛选没有交易回合</div></section>'}else{content.innerHTML=state.page==='list'?list(c):stats(c)};bind()}
function openHelp(w){const p=w.querySelector('.help-popover'),b=w.querySelector('.help-icon');w.classList.add('is-open');if(p)p.hidden=false;if(b){b.setAttribute('aria-expanded','true')}}function closeHelp(w){const p=w.querySelector('.help-popover'),b=w.querySelector('.help-icon');w.classList.remove('is-open');if(p)p.hidden=true;if(b)b.setAttribute('aria-expanded','false')}
function bind(){document.querySelectorAll('#mode-controls [data-mode]').forEach(b=>b.addEventListener('click',()=>{state.mode=b.dataset.mode;render()}));document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;render()}));document.querySelectorAll('[data-measure]').forEach(b=>b.addEventListener('click',()=>{state.measure=b.dataset.measure;render()}));document.querySelectorAll('[data-date]').forEach(s=>s.addEventListener('change',()=>{state.date[state.mode]=s.value;render()}));document.getElementById('preview-select').value=state.preview;document.getElementById('preview-select').onchange=e=>{state.preview=e.target.value;render()};document.querySelectorAll('.help-wrap').forEach(w=>{const b=w.querySelector('.help-icon');w.addEventListener('mouseenter',()=>openHelp(w));w.addEventListener('mouseleave',()=>closeHelp(w));b.addEventListener('click',e=>{e.stopPropagation();w.classList.contains('is-open')?closeHelp(w):openHelp(w)});b.addEventListener('focus',()=>openHelp(w));b.addEventListener('blur',()=>closeHelp(w))})}
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.help-wrap').forEach(closeHelp)});render();
</script>
</body></html>
