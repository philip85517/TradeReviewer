<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="06-empty.svg"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}</style><rect width="1440" height="1000" fill="#0B1019"/><text x="64" y="52" font-size="24" fill="#E6EDF7" font-weight="600" text-anchor="start">交易库 / 统计</text><text x="64" y="78" font-size="14" fill="#6CA8FF" font-weight="600" text-anchor="start">统计</text><text x="64" y="104" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">无可计算回合：保持条件与统计空间</text><rect x="64" y="128" width="1312" height="54" rx="8" fill="#111A26" stroke="#283448"/><text x="88" y="162" font-size="14" fill="#A8B6CB" font-weight="600" text-anchor="start">实盘</text><text x="166" y="162" font-size="14" fill="#E6EDF7" font-weight="600" text-anchor="start">模拟盘</text><path d="M164 178 L222 178" fill="none" stroke="#6CA8FF" stroke-width="2"/><rect x="64" y="198" width="1312" height="58" rx="8" fill="#162233" stroke="#283448"/><text x="88" y="233" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">练习日期</text><rect x="182" y="209" width="190" height="36" rx="8" fill="#111A26" stroke="#283448"/><svg x="190" y="218" width="16" height="16" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 2v4M16 2v4M5 9h14" fill="none" stroke="#E6EDF7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="214" y="233" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">全部</text><text x="406" y="233" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="start">市场：全部</text><text x="552" y="233" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="start">排序：日期 ↓</text><rect x="64" y="278" width="1312" height="388" rx="8" fill="#111A26" stroke="#283448"/><text x="88" y="310" font-size="16" fill="#E6EDF7" font-weight="600" text-anchor="start">无可计算回合</text><g role="img" aria-label="统计口径：未平仓回合不计入已平仓统计；当前市场估值缺失不影响已闭合回合；只有收益所需输入缺失时才显示不可计算原因与“—”。" data-control="stats-scope-info" data-icon="info"><svg x="280" y="298" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><title>统计口径：未平仓回合不计入已平仓统计；当前市场估值缺失不影响已闭合回合；只有收益所需输入缺失时才显示不可计算原因与“—”。</title><circle cx="12" cy="12" r="9" fill="none" stroke="#6CA8FF" stroke-width="1.5"/><path d="M12 10v6M12 7h.01" fill="none" stroke="#6CA8FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></g><text x="720" y="438" font-size="18" fill="#E6EDF7" font-weight="400" text-anchor="middle">没有已平仓回合</text><text x="720" y="470" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="middle">扩大日期范围或重试。</text></svg>