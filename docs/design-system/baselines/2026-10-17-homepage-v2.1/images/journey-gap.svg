<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1406" viewBox="0 0 1500 1406" role="img" aria-label="F05 · 缺口原因：进入、失败与焦点返回"><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" style="font-variant-numeric:tabular-nums"><rect x="0" y="0" width="1500" height="1406" rx="0" fill="#0B1019" stroke="#0B1019"/><text x="32" y="38" fill="#E6EDF7" font-size="24" font-weight="600">F05 · 缺口原因：进入、失败与焦点返回</text><text x="32" y="68" fill="#A8B6CB" font-size="14" font-weight="400">局部设计分镜 · 1 SVG 单位 = 1px；整页布局沿用主稿；注释位于控件之外。</text><rect x="24" y="96" width="690" height="620" rx="8" fill="#111A26" stroke="#283448"/><text x="48" y="132" fill="#6CA8FF" font-size="18" font-weight="600">缺口入口</text><g transform="translate(48,160)"><rect x="0" y="0" width="640" height="190" rx="8" fill="#111A26" stroke="#283448"/><text x="16" y="26" fill="#E6EDF7" font-size="14" font-weight="400">期间净盈亏（按日） · CNY</text><path d="M40 145L610 145" fill="none" stroke="#283448"/><path d="M40 120L120 102" fill="none" stroke="#6CA8FF" stroke-width="2"/><path d="M120 102L200 112" fill="none" stroke="#6CA8FF" stroke-width="2"/><path d="M200 112L280 78" fill="none" stroke="#6CA8FF" stroke-width="2"/><path d="M440 61L520 68" fill="none" stroke="#6CA8FF" stroke-width="2"/><path d="M520 68L600 42" fill="none" stroke="#6CA8FF" stroke-width="2"/><circle cx="40" cy="120" r="3" fill="#6CA8FF"/><circle cx="120" cy="102" r="3" fill="#6CA8FF"/><circle cx="200" cy="112" r="3" fill="#6CA8FF"/><circle cx="280" cy="78" r="3" fill="#6CA8FF"/><circle cx="440" cy="61" r="3" fill="#6CA8FF"/><circle cx="520" cy="68" r="3" fill="#6CA8FF"/><circle cx="600" cy="42" r="3" fill="#6CA8FF"/><text x="40" y="174" fill="#A8B6CB" font-size="12" font-weight="400">10-01</text><text x="552" y="174" fill="#A8B6CB" font-size="12" font-weight="400">10-15</text><rect x="320" y="105" width="180" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="332" y="128" fill="#E6EDF7" font-size="13" font-weight="400">10-12 查看原因</text><rect x="317" y="102" width="186" height="42" rx="8" fill="none" stroke="#A9C8FF" stroke-width="2"/><text x="0" y="245" fill="#A8B6CB" font-size="13" font-weight="400">Tab到“查看原因”，Enter打开；焦点环包围真实入口。</text><text x="0" y="268" fill="#A8B6CB" font-size="13" font-weight="400">Esc/×关闭后焦点返回同一缺口；外点关闭原因浮层。</text><text x="0" y="470" fill="#A8B6CB" font-size="13" font-weight="400">首个原因控件可获焦；关闭不改变已应用期间和当前持仓。</text><text x="0" y="493" fill="#A8B6CB" font-size="13" font-weight="400">缺口恢复仅在该范围新请求成功后绘制可靠点。</text></g><rect x="762" y="96" width="690" height="620" rx="8" fill="#111A26" stroke="#283448"/><text x="786" y="132" fill="#6CA8FF" font-size="18" font-weight="600">原因打开</text><g transform="translate(786,160)"><rect x="0" y="0" width="640" height="190" rx="8" fill="#111A26" stroke="#283448"/><text x="16" y="26" fill="#E6EDF7" font-size="14" font-weight="400">期间净盈亏（按日） · CNY</text><path d="M40 145L610 145" fill="none" stroke="#283448"/><path d="M40 120L120 102" fill="none" stroke="#6CA8FF" stroke-width="2"/><path d="M120 102L200 112" fill="none" stroke="#6CA8FF" stroke-width="2"/><path d="M200 112L280 78" fill="none" stroke="#6CA8FF" stroke-width="2"/><path d="M440 61L520 68" fill="none" stroke="#6CA8FF" stroke-width="2"/><path d="M520 68L600 42" fill="none" stroke="#6CA8FF" stroke-width="2"/><circle cx="40" cy="120" r="3" fill="#6CA8FF"/><circle cx="120" cy="102" r="3" fill="#6CA8FF"/><circle cx="200" cy="112" r="3" fill="#6CA8FF"/><circle cx="280" cy="78" r="3" fill="#6CA8FF"/><circle cx="440" cy="61" r="3" fill="#6CA8FF"/><circle cx="520" cy="68" r="3" fill="#6CA8FF"/><circle cx="600" cy="42" r="3" fill="#6CA8FF"/><text x="40" y="174" fill="#A8B6CB" font-size="12" font-weight="400">10-01</text><text x="552" y="174" fill="#A8B6CB" font-size="12" font-weight="400">10-15</text><rect x="320" y="105" width="180" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="332" y="128" fill="#E6EDF7" font-size="13" font-weight="400">10-12 查看原因</text><rect x="120" y="225" width=