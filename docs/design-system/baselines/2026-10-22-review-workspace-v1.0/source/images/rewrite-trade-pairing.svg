<svg xmlns="http://www.w3.org/2000/svg" width="952" height="510" viewBox="0 0 952 510" role="img" aria-labelledby="title desc"><title id="title">图 B · 一次退出可以匹配多笔独立交易</title><desc id="desc">回合包容多次决策；批次辅助数量匹配，不能代替原始成交身份。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6CA8FF"/></marker></defs><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="950" height="508" rx="12" fill="#0B1019" stroke="#283448"/><text x="28" y="40" font-size="23" fill="#E6EDF7" font-weight="600" text-anchor="start">图 B · 一次退出可以匹配多笔独立交易</text><text x="28" y="70" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">回合包容多次决策；批次辅助数量匹配，不能代替原始成交身份。</text><rect x="28" y="108" width="280" height="158" rx="8" fill="#111A26" stroke="#283448"/><text x="48" y="140" font-size="19" fill="#E6EDF7" font-weight="600" text-anchor="start">第一笔独立交易</text><text x="48" y="173" font-size="18" fill="#A8B6CB" font-weight="400" text-anchor="start">先买 100 @10</text><text x="48" y="197" font-size="18" fill="#A8B6CB" font-weight="400" text-anchor="start">被本次退出匹配 20</text><text x="48" y="221" font-size="18" fill="#A8B6CB" font-weight="400" text-anchor="start">剩余 80</text><rect x="336" y="108" width="280" height="158" rx="8" fill="#111A26" stroke="#283448"/><text x="356" y="140" font-size="19" fill="#E6EDF7" font-weight="600" text-anchor="start">第二笔独立交易</text><text x="356" y="173" font-size="18" fill="#A8B6CB" font-weight="400" text-anchor="start">后买 60 @12</text><text x="356" y="197" font-size="18" fill="#A8B6CB" font-weight="400" text-anchor="start">优先匹配全部 60</text><text x="356" y="221" font-size="18" fill="#A8B6CB" font-weight="400" text-anchor="start">剩余 0</text><rect x="644" y="108" width="280" height="158" rx="8" fill="#111A26" stroke="#283448"/><text x="664" y="140" font-size="19" fill="#E6EDF7" font-weight="600" text-anchor="start">同一次卖出决策</text><text x="664" y="173" font-size="18" fill="#A8B6CB" font-weight="400" text-anchor="start">卖 80 @13</text><text x="664" y="197" font-size="18" fill="#A8B6CB" font-weight="400" text-anchor="start">保留一个退出决策身份</text><text x="664" y="221" font-size="18" fill="#A8B6CB" font-weight="400" text-anchor="start">匹配片段：60 + 20</text><path d="M 784 278 V 318 H 476 V 278" fill="none" stroke="#6CA8FF" stroke-width="2" marker-end="url(#arrow)"/><text x="590" y="307" font-size="15" fill="#6CA8FF" font-weight="400" text-anchor="start">① 最近的 60</text><path d="M 784 330 V 376 H 168 V 278" fill="none" stroke="#6CA8FF" stroke-width="2" marker-end="url(#arrow)"/><text x="330" y="365" font-size="15" fill="#6CA8FF" font-weight="400" text-anchor="start">② 再匹配前批 20</text><rect x="28" y="408" width="896" height="74" rx="8" fill="#111A26" stroke="#283448"/><text x="48" y="438" font-size="18" fill="#E6EDF7" font-weight="600" text-anchor="start">数量守恒：100 + 60 − 80 = 80；原始成交不改写。</text><text x="48" y="464" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">最近优先为用户方向；聚合、同秒排序、费用分摊和单笔完成仍待确认。</text></g></svg>