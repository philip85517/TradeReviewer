ition:absolute;left:50%;top:62%;transform:translate(-50%,-50%);height:36px}.retry.show{display:block}.review{max-width:1328px;margin:18px auto 48px;padding:14px 18px;border:1px dashed var(--line);color:var(--muted);font-size:12px}.review button{height:30px;font-size:12px;margin:0 8px 8px 0}@media(max-width:1100px){main{width:calc(100% - 64px)}}@media(max-width:900px){main{padding:24px 0}.kpis{grid-template-columns:repeat(2,1fr)}header{display:block}.controls{justify-content:flex-start;margin-top:18px}.review{margin:18px;padding:14px}}@media(max-width:560px){.kpis{grid-template-columns:1fr}.chart{padding:16px}.chart-wrap{grid-template-columns:60px 1fr}.ylabels{font-size:11px;padding-right:8px}.value{font-size:26px}}

<main><header><div><h1>历史已平仓</h1><p>历史完成交易 · 当前持仓浮动盈亏独立展示，不进入历史胜率</p></div><div class="controls"><button id="range" aria-label="选择范围"></button><button id="mode" aria-label="选择分期或累计"></button><button id="metric" aria-label="选择指标"></button></div></header>

<script src="history-stats-render.js"></script><script src="fixture.js"></script><script>if (false) {
const q=s=>document.querySelector(s),sum=a=>a.reduce((n,v)=>n+(v||0),0),fmt=n=>n.toLocaleString('en-US');let fixture=window.HCR04_FIXTURE,ranges=Object.keys(fixture.ranges),ri=0,metric='profit',cumulative=false,state='normal';const defs={profit:{name:'净盈亏',unit:'CNY'},win:{name:'胜率',unit:'%'},rounds:{name:'已平仓回合',unit:'回合'}};function ticks(min,max){const step=(max-min)/4;return[max,max-step,max-step*2,max-step*3,min].map(v=>Math.round(v*10)/10)}function y(v,min,max){return 220-((v-min)/(max-min))*220}

)body='<text x="500" y="94" text-anchor="middle" fill="var(--yellow)" font-size="15">源数据缺口</text><text x="500" y="122" text-anchor="middle" fill="var(--muted)" font-size="13">该期间不可计算，不等同于零回合</text>';else if(state==='valuation')body='<text x="500" y="94" text-anchor="middle" fill="var(--yellow)" font-size="15">当前持仓浮盈估值缺失</text><text x="500" y="122" text-anchor="middle" fill="var(--muted)" font-size="13">只影响当前估值，不进入历史已平仓统计</text>';else{let segment=[];vals.forEach((v,i)=>{if(v===null){if(segment.length)body+='<polyline points="'+segment.join(' ')+'" fill="none" stroke="var(--blue)" stroke-width="3"/>';segment=[];body+='<text x="'+(i/(vals.length-1||1)*1000)+'" y="205" text-anchor="middle" fill="var(--yellow)" font-size="11">缺口</text>'}else segment.push(i/(vals.length-1||1)*1000+','+y(v,vmin,vmax))});if(segment.length)body+='<polyline points="'+segment.join(' ')+'" fill="none" stroke="var(--blue)" stroke-width="3"/>';vals.forEach((v,i)=>{if(v!==null)body+='<circle cx="'+(i/(vals.length-1||1)*1000)+'" cy="'+y(v,vmin,vmax)+'" r="5" fill="var(--blue)"/>'})}q('#trend').innerHTML=body;q('#retry').classList.toggle('show',state==='error');q('#reviewText').textContent=state==='normal'?'同一范围内由顶部单一指标控件切换净盈亏、胜率、回合数。':state==='loading'?'加载中：保留图表槽位。':state==='empty'?'真实空态：无已平仓交易，回合数为0、胜率为—。':state==='gap'?'源数据缺口：明确不可计算，不伪造为0。':state==='valuation'?'当前估值缺失：边界说明，不替代历史交易数据。':'失败态：点击“重试”恢复当前条件。'}

<script>
(() => {
  const q = selector => document.querySelector(selector);
  const fixture = window.HCR04_FIXTURE;
  const ranges = Object.keys(fixture.ranges);
  let ri = 0, metric = 'profit', cumulative = false, state = 'normal';
  const defs = { profit: { name: '净盈亏', unit: 'CNY' }, win: { name: '胜率', unit: '%' }, rounds: { name: '已平仓回合', unit: '回合' } };
  const shared = window.HCR04_RENDER;
  const formatAmount = value => Number(value).toLocaleString('en-US');
  const formatValue = (value, metricName) => metricName === 'win' ? `${Number(value).toFixed(1)}%` : formatAmount(value);
  const escapeAttr = value => String(value).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;');
  const stateMessage = {
    empty: ['所选范围无已平仓交易', ''],
    loading: ['正在加载历史统计…', ''],
    error: ['加载失败', '请点击重试，当前筛选条件保持不变'],
    gap: ['源数据缺口', '该期间不可计算，不等同于零回合'],
    valuation: ['当前持仓浮盈估值缺失', '只影响当前估值，不进入历史已平仓统计']
  };

  function axisMarkup(chart, metricName) {
    return chart.scale.ticks.map(tick => {
      const yPos = shared.y(tick, chart.scale.min, chart.scale.max, 220);
      const label = metricName === 'win' ? `${tick}%` : formatAmount(tick);
      return `<line x1="0" y1="${yPos}" x2="1000" y2="${yPos}" stroke="var(--line)"/><text x="-8" y="${yPos + 4}" text-anchor="end" fill="var(--muted)" font-size="11">${escapeAttr(label)}</text>`;
    }).join('');
  }

  function renderUnified() {
    const d = fixture.ranges[ranges[ri]];
    const def = defs[metric];
    const model = shared.normalizeModel(d);
    const values = shared.series({ metric, p: model.p, w: model.w, r: model.r, cumulative, status: model.status });
    const chart = shared.renderChartSvg({ values, metric, status: model.status, dimensions: { width: 1000, height: 220 } });
    const rounds = shared.sum(model.r), wins = shared.sum(model.w), profit = shared.sum(model.p), fees = shared.sum(model.f);
    q('#range').textContent = `${d.label}⌄`;
    q('#mode').textContent = `${cumulative ? '累计' : '分期'}⌄`;
    q('#metric').textContent = `${def.name}⌄`;
    q('#chartTitle').textContent = `${def.name} · ${cumulative ? '累计' : '分期'}`;
    q('#unit').textContent = def.unit;
    q('#xlabels').innerHTML = model.x.map(x => `<span>${x}</span>`).join('');
    q('#total').textContent = state === 'empty' ? '—' : `${profit >= 0 ? '+' : ''}${formatAmount(profit)}`;
    q('#rounds').textContent = state === 'empty' ? '0' : formatAmount(rounds);
    q('#win').textContent = state === 'empty' ? '—' : rounds ? `${(wins / rounds * 100).toFixed(1)}%` : '—';
    q('#winSub').textContent = state === 'empty' ? '无已平仓回合' : `${wins} / ${rounds} 盈利回合 · 持平计入分母`;
    q('#fees').textContent = state === 'empty' ? '0' : formatAmount(fees);

    const validIndices = values.map((value, index) => value === null ? null : index).filter(index => index !== null);
    let pointCursor = 0;
    let body = chart.svg.replace(/<circle\b[^>]*>/g, tag => {
      const index = validIndices[pointCursor++];
      const label = `${model.x[index]} · ${def.name} ${formatValue(values[index], metric)}`;
      return tag.replace('<circle', `<circle class="point" tabindex="0" role="img" data-point-index="${index}" aria-label="${escapeAttr(label)}"`);
    });
    const futureRuns = [];
    model.status.forEach((status, index) => {
      if (status === 'future-uncovered') {
        const last = futureRuns[futureRuns.length - 1];
        if (last && last[1] === index - 1) last[1] = index;
        else futureRuns.push([index, index]);
      }
    });
    body = body.replaceAll(/<text[^>]*>未来未覆盖<\/text>/g, '') + futureRuns.map(([start, end]) => {
      const xPos = shared.xAt((start + end) / 2, model.x.length, 1000);
      return `<text x="${xPos}" y="205" text-anchor="middle" fill="var(--yellow)" font-size="11">未来未覆盖</text>`;
    }).join('');
    if (stateMessage[state]) {
      const [primary, secondary] = stateMessage[state];
      body = `<text x="500" y="${secondary ? 88 : 108}" text-anchor="middle" fill="var(${state === 'error' ? '--red' : '--yellow'})" font-size="15">${primary}</text>${secondary ? `<text x="500" y="118" text-anchor="middle" fill="var(--muted)" font-size="13">${secondary}</text>` : ''}`;
    }
    q('#trend').setAttribute('viewBox', '-55 0 1055 220');
    q('#trend').innerHTML = `<g aria-hidden="true">${axisMarkup(chart, metric)}</g>${body}<g id="pointOverlay" hidden><line id="crosshairX" stroke="var(--yellow)" stroke-dasharray="3 3" y1="0" y2="220"/><line id="crosshairY" stroke="var(--yellow)" stroke-dasharray="3 3" x1="0" x2="1000"/><g id="pointAxisLabels"><text id="axisLabelX" fill="var(--text)" font-size="12" text-anchor="middle"/><text id="axisLabelY" fill="var(--text)" font-size="12" text-anchor="end"/></g><g id="tooltipBox" width="264" height="112" transform="translate(0 0)"><rect width="264" height="112" rx="8" fill="#162233" stroke="var(--yellow)"/><text id="tooltipDate" x="12" y="14" fill="var(--muted)" font-size="12"/><text id="tooltipCoverage" x="252" y="14" fill="var(--muted)" font-size="12" text-anchor="end"/><text x="12" y="28" fill="var(--muted)" font-size="12">市值</text><text id="tooltipMarket" x="252" y="28" fill="var(--text)" font-size="12" font-weight="600" text-anchor="end"/><text x="12" y="42" fill="var(--muted)" font-size="12">浮盈</text><text id="tooltipFloating" x="252" y="42" fill="var(--green)" font-size="12" font-weight="600" text-anchor="end"/><text x="12" y="56" fill="var(--muted)" font-size="12">累计已实现</text><text id="tooltipRealized" x="252" y="56" fill="var(--green)" font-size="12" font-weight="600" text-anchor="end"/><text x="12" y="70" fill="var(--muted)" font-size="12">累计净盈亏</text><text id="tooltipCumulative" x="252" y="70" fill="var(--green)" font-size="12" font-weight="600" text-anchor="end"/><text x="12" y="84" fill="var(--muted)" font-size="13">期间净盈亏</text><text id="tooltipPeriod" x="252" y="84" fill="var(--green)" font-size="13" font-weight="600" text-anchor="end"/><text x="12" y="98" fill="var(--muted)" font-size="12">费用</text><text id="tooltipFees" x="252" y="98" fill="var(--muted)" font-size="12" font-weight="600" text-anchor="end"/></g></g>`;
    q('#retry').classList.toggle('show', state === 'error');
    q('#reviewText').textContent = state === 'normal' ? '同一范围内由顶部单一指标控件切换净盈亏、胜率、回合数。' : state === 'loading' ? '加载中：保留图表槽位。' : state === 'empty' ? '真实空态：无已平仓交易，回合数为0、胜率为—。' : state === 'gap' ? '源数据缺口：明确不可计算，不伪造为0。' : state === 'valuation' ? '当前估值缺失：边界说明，不替代历史交易数据。' : '失败态：点击“重试”恢复当前条件。';
    q('#chartTitle').setAttribute('tabindex', '-1');
    q('#chartTitle').setAttribute('aria-live', 'polite');
    const overlay = q('#pointOverlay');
    let dismissed = false;
    const hidePoint = () => { overlay.setAttribute('hidden', ''); };
    const showPoint = circle => {
      dismissed = false;
      const index = Number(circle.dataset.pointIndex), cx = Number(circle.getAttribute('cx')), cy = Number(circle.getAttribute('cy'));
      const label = `${model.x[index]} · ${def.name} ${formatValue(values[index], metric)}`;
      q('#crosshairX').setAttribute('x1', cx); q('#crosshairX').setAttribute('x2', cx);
      q('#crosshairY').setAttribute('y1', cy); q('#crosshairY').setAttribute('y2', cy);
      const boxX = cx > 700 ? cx - 264 : cx + 12;
      const boxY = cy > 124 ? 4 : 104;
      q('#tooltipBox').setAttribute('transform', `translate(${Math.max(0, Math.min(736, boxX))} ${boxY})`);
      q('#tooltipDate').textContent = `${model.x[index]} CNY`;
      q('#tooltipCoverage').textContent = '汇率✓ 行情✓';
      q('#tooltipMarket').textContent = '—';
      q('#tooltipFloating').textContent = '—';
      q('#tooltipRealized').textContent = formatValue(values[index], metric);
      q('#tooltipCumulative').textContent = formatValue(cumulative ? values[index] : shared.series({ metric, p: model.p, w: model.w, r: model.r, cumulative: true, status: model.status })[index], metric);
      q('#tooltipPeriod').textContent = formatValue(values[index], metric);
      q('#tooltipFees').textContent = `${formatAmount(model.f[index] ?? 0)} 已扣`;
      const axisX = Math.max(42, Math.min(958, cx));
      q('#axisLabelX').setAttribute('x', axisX); q('#axisLabelX').setAttribute('y', 212); q('#axisLabelX').textContent = model.x[index];
      const axisY = Math.max(18, Math.min(202, cy));
      q('#axisLabelY').setAttribute('x', 36); q('#axisLabelY').setAttribute('y', axisY); q('#axisLabelY').textContent = formatValue(values[index], metric);
      overlay.removeAttribute('hidden');
    };
    q('#trend').querySelectorAll('.point').forEach(circle => {
      circle.addEventListener('mouseenter', () => showPoint(circle));
      circle.addEventListener('mouseleave', hidePoint);
      circle.addEventListener('focus', () => showPoint(circle));
      circle.addEventListener('blur', hidePoint);
      circle.addEventListener('keydown', event => { if (event.key === 'Escape') { dismissed = true; hidePoint(); event.preventDefault(); event.stopPropagation(); } });
    });
  }

  window.render = renderUnified;
  q('#range').onclick = () => { ri = (ri + 1) % ranges.length; state = 'normal'; renderUnified(); };
  q('#mode').onclick = () => { cumulative = !cumulative; renderUnified(); };
  q('#metric').onclick = () => { metric = metric === 'profit' ? 'win' : metric === 'win' ? 'rounds' : 'profit'; renderUnified(); };
  document.querySelectorAll('[data-state]').forEach(button => button.onclick = () => { state = button.dataset.state; renderUnified(); });
  q('#retry').onclick = () => { state = 'normal'; renderUnified(); q('#chartTitle').focus(); };
  document.addEventListener('keydown', event => { if (event.key === 'Escape') { const overlay = q('#pointOverlay'); if (overlay) overlay.setAttribute('hidden', ''); event.preventDefault(); event.stopImmediatePropagation(); } }, true);
  renderUnified();
})();
</script>
<style>
/* Round 7: keep the shared SVG overlay hidden and put month labels in its coordinate system. */
#pointOverlay[hidden]{display:none!important}
#pointOverlay{pointer-events:none}
</style>
<script>
(() => {
  const trend = document.querySelector('#trend');
  const labels = document.querySelector('#xlabels');
  if (!trend || !labels) return;
  let syncing = false;
  const syncSvgLabels = () => {
    if (syncing) return;
    syncing = true;
    trend.querySelectorAll('.hcr-x-label').forEach(node => node.remove());
    const spans = [...labels.querySelectorAll('span')];
    const width = 1000;
    spans.forEach((span, index) => {
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      const x = index / (spans.length - 1 || 1) * width;
      text.setAttribute('class', 'hcr-x-label');
      text.setAttribute('x', String(x));
      text.setAttribute('y', '218');
      text.setAttribute('fill', 'var(--muted)');
      text.setAttribute('font-size', '11');
      text.setAttribute('text-anchor', index === 0 ? 'start' : index === spans.length - 1 ? 'end' : 'middle');
      text.setAttribute('pointer-events', 'none');
      text.textContent = span.textContent;
      trend.appendChild(text);
    });
    syncing = false;
  };
  new MutationObserver(syncSvgLabels).observe(labels, { childList: true, subtree: true });
  syncSvgLabels();
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    const overlay = document.querySelector('#pointOverlay');
    if (overlay) overlay.setAttribute('hidden', '');
    event.stopImmediatePropagation();
  }, true);
})();
</script></body></html>
