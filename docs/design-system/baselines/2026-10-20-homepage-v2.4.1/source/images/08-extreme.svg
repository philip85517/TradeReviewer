text-anchor="end">点击区间查看局部回合</text><text x="1160" y="866" font-size="11" fill="#A8B6CB" font-weight="400" text-anchor="end">筛选只影响下方列表，不重算此分布。</text><text x="64" y="970" font-size="11" fill="#71839E" font-weight="400" text-anchor="start">极值态：同一极值实盘回合集合派生坐标、摘要和分布。</text></svg>