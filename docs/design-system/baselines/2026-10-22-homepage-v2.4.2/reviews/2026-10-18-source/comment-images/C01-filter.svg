<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" role="img" aria-label="V2.2 filter"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}</style><rect width="100%" height="100%" fill="#0B1019"/><text x="40" y="40" font-size="22" fill="#E6EDF7" font-weight="600" text-anchor="start">筛选 · 三个附加维度</text><text x="40" y="69" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">账户与市场在页头；浮层只承载类别、未实现数据、待复盘，草稿退出后仍保留</text><rect x="40" y="100" width="36" height="36" rx="6" fill="#111A26" stroke="#283448"/><svg x="46.0" y="106" width="24" height="24" viewBox="0 0 24 24"><path d="M3 4h18l-7 8v8l-4-2v-6z" fill="none" stroke="#E6EDF7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><rect x="40" y="152" width="440" height="570" rx="8" fill="#162233" stroke="#283448"/><text x="64" y="188" font-size="16" fill="#E6EDF7" font-weight="600" text-anchor="start">类别</text><rect x="64" y="220" width="16" height="16" rx="3" fill="#6CA8FF" stroke="#6CA8FF"/><svg x="60" y="216" width="24" height="24" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" fill="none" stroke="#0B1019" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="92" y="233" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">股票</text><rect x="64" y="264" width="16" height="16" rx="3" fill="#6CA8FF" stroke="#6CA8FF"/><svg x="60" y="260" width="24" height="24" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" fill="none" stroke="#0B1019" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="92" y="277" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">ETF</text><rect x="64" y="308" width="16" height="16" rx="3" fill="#111A26" stroke="#283448"/><text x="92" y="321" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">基金</text><text x="64" y="362" font-size="16" fill="#E6EDF7" font-weight="600" text-anchor="start">是否有未实现数据</text><rect x="64" y="394" width="16" height="16" rx="3" fill="#6CA8FF" stroke="#6CA8FF"/><svg x="60" y="390" width="24" height="24" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" fill="none" stroke="#0B1019" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="92" y="407" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">有</text><rect x="64" y="438" width="16" height="16" rx="3" fill="#111A26" stroke="#283448"/><text x="92" y="451" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">无</text><text x="64" y="492" font-size="16" fill="#E6EDF7" font-weight="600" text-anchor="start">是否待复盘</text><rect x="64" y="524" width="16" height="16" rx="3" fill="#111A26" stroke="#283448"/><text x="92" y="537" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">是</text><rect x="64" y="568" width="16" height="16" rx="3" fill="#6CA8FF" stroke="#6CA8FF"/><svg x="60" y="564" width="24" height="24" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6" fill="none" stroke="#0B1019" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="92" y="581" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">否</text><rect x="64" y="632" width="88" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="76" y="655" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">应用</text><rect x="164" y="632" width="128" height="36" rx="6" fill="#111A26" stroke="#283448"/><text x="176" y="655" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">清除附加条件</text><rect x="308" y="632" width="128" height="36" rx="6" fill="#111A26" stroke="#283448"/><text x="320" y="655" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">恢复全部默认</text><text x="520" y="188" font-size="18" fill="#E6EDF7" font-weight="600" text-anchor="start">草稿与清理语义</text><rect x="520" y="220" width="540" height="230" rx="8" fill="#162233" stroke="#283448"/><text x="544" y="258" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">Esc / 外点关闭：草稿仍保留</text><text x="544" y="294" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">重新打开：继续编辑未应用条件</text><text x="544" y="330" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">清除附加条件：类别与两个布尔维度</text><text x="544" y="366" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">恢复全部默认：恢复类别、账户、市场与日期</text><text x="544" y="402" font-size="14" fill="#FFC66D" font-weight="400" text-anchor="start">切换账户 / 市场：丢弃旧草稿</text><rect x="520" y="500" width="540" height="190" rx="8" fill="#162233" stroke="#283448"/><text x="544" y="538" font-size="16" fill="#E6EDF7" font-weight="600" text-anchor="start">已生效结果 · 三维附加条件</text><rect x="544" y="560" width="24" height="24" rx="4" fill="#162233" stroke="none"/><text x="550" y="577" font-size="12" fill="#6CA8FF" font-weight="400" text-anchor="start">3</text><text x="544" y="612" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">股票、ETF · 有未实现 · 待复盘：否</text><text x="544" y="650" font-size="13" fill="#A8B6CB" font-weight="400" text-anchor="start">清除附加与恢复全部默认是两个不同动作</text><text x="40" y="884" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">V2.2 · 合成示例数据 · 设计状态图，非产品运行截图</text></svg>