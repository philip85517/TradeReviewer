<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="09-missing-input.svg"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}</style><rect width="1440" height="1000" fill="#0B1019"/><text x="64" y="52" font-size="24" fill="#E6EDF7" font-weight="600" text-anchor="start">交易库 / 统计</text><text x="64" y="78" font-size="14" fill="#6CA8FF" font-weight="600" text-anchor="start">统计</text><text x="64" y="104" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">统计不可计算：保留条件与原因</text><rect x="64" y="128" width="1312" height="54" rx="8" fill="#111A26" stroke="#283448"/><text x="88" y="162" font-size="14" fill="#A8B6CB" font-weight="600" text-anchor="start">实盘</text><text x="166" y="162" font-size="14" fill="#E6EDF7" font-weight="600" text-anchor="start">模拟盘</text><path d="M164 178 L222 178" fill="none" stroke="#6CA8FF" stroke-width="2"/><rect x="64" y="198" width="1312" height="58" rx="8" fill="#162233" stroke="#283448"/><text x="88" y="233" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">练习日期</text><rect x="182" y="209" width="240" height="36" rx="8" fill="#111A26" stroke="#283448"/><svg x="190" y="218" width="16" height="16" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 2v4M16 2v4M5 9h14" fill="none" stroke="#E6EDF7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><text x="214" y="233" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="start">本月（2026-10-01—10-19）</text><text x="452" y="233" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="start">市场：全部</text><text x="598" y="233" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="start">排序：日期 ↓</text><rect x="64" y="278" width="1312" height="388" rx="8" fill="#1B1813" stroke="#76502F"/><text x="88" y="310" font-size="16" fill="#FFC66D" font-weight="600" text-anchor="start">部分统计不可计算</text><text x="88" y="356" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">回合收益输入</text><text x="278" y="356" font-size="24" fill="#FFC66D" font-weight="600" text-anchor="start">—</text><text x="88" y="402" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">不可计算集合</text><text x="278" y="402" font-size="15" fill="#E6EDF7" font-weight="600" text-anchor="start">MISSING-01、MISSING-02</text><text x="88" y="448" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">原因</text><text x="278" y="448" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="start">缺少平仓估值，不能计算金额或收益率。</text><text x="88" y="514" font-size="16" fill="#E6EDF7" font-weight="600" text-anchor="start">盈亏分布</text><text x="720" y="514" font-size="28" fill="#FFC66D" font-weight="600" text-anchor="middle">—</text><text x="720" y="552" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="middle">补齐输入后重试。</text><rect x="920" y="278" width="456" height="388" rx="8" fill="#111A26" stroke="#283448"/><text x="944" y="310" font-size="16" fill="#E6EDF7" font-weight="600" text-anchor="start">范围汇总</text><g role="img" aria-label="统计口径：缺少平仓估值时金额与收益率不可计算；缺失项不以 0 或完整分布替代；补齐输入后重试。" data-control="stats-scope-info" data-icon="info"><svg x="1080" y="298" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><title>统计口径：缺少平仓估值时金额与收益率不可计算；缺失项不以 0 或完整分布替代；补齐输入后重试。</title><circle cx="12" cy="12" r="9" fill="none" stroke="#6CA8FF" stroke-width="1.5"/><path d="M12 10v6M12 7h.01" fill="none" stroke="#6CA8FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></g><text x="944" y="362" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">净盈亏</text><text x="944" y="400" font-size="26" fill="#FFC66D" font-weight="600" text-anchor="start">—</text><text x="944" y="456" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">胜率</text><text x="944" y="494" font-size="26" fill="#FFC66D" font-weight="600" text-anchor="start">—</text></svg>