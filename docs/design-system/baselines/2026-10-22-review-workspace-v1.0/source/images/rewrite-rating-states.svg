<svg xmlns="http://www.w3.org/2000/svg" width="952" height="520" viewBox="0 0 952 520" role="img" aria-labelledby="title desc"><title id="title">图 E · 星级之外必须显示评价状态</title><desc id="desc">同一维度的四种状态；不由停顿、点击记录或盈亏推断心理体验。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6CA8FF"/></marker></defs><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="950" height="518" rx="12" fill="#0B1019" stroke="#283448"/><text x="28" y="40" font-size="23" fill="#E6EDF7" font-weight="600" text-anchor="start">图 E · 星级之外必须显示评价状态</text><text x="28" y="70" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">同一维度的四种状态；不由停顿、点击记录或盈亏推断心理体验。</text><rect x="28" y="116" width="212" height="238" rx="8" fill="#111A26" stroke="#283448"/><text x="44" y="151" font-size="19" fill="#E6EDF7" font-weight="600" text-anchor="start">未评分</text><text x="44" y="199" font-size="23" fill="#FFC66D" font-weight="400" text-anchor="start">—</text><text x="44" y="242" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">尚未进行评价</text><text x="44" y="272" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">保留输入入口</text><text x="44" y="302" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">不自动显示三星</text><rect x="256" y="116" width="212" height="238" rx="8" fill="#111A26" stroke="#283448"/><text x="272" y="151" font-size="19" fill="#E6EDF7" font-weight="600" text-anchor="start">资料不足</text><text x="272" y="199" font-size="23" fill="#FFC66D" font-weight="400" text-anchor="start">—</text><text x="272" y="242" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">缺少可核验计划</text><text x="272" y="272" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">说明缺失字段</text><text x="272" y="302" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">没有系统建议</text><rect x="484" y="116" width="212" height="238" rx="8" fill="#111A26" stroke="#283448"/><text x="500" y="151" font-size="19" fill="#E6EDF7" font-weight="600" text-anchor="start">系统建议</text><text x="500" y="199" font-size="23" fill="#FFC66D" font-weight="400" text-anchor="start">★★★★☆</text><text x="500" y="242" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">纪律 C=3/4=0.75</text><text x="500" y="272" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">V0 候选规则：四星</text><text x="500" y="302" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">可以查看四条依据</text><rect x="712" y="116" width="212" height="238" rx="8" fill="#111A26" stroke="#283448"/><text x="728" y="151" font-size="19" fill="#E6EDF7" font-weight="600" text-anchor="start">人工修改</text><text x="728" y="199" font-size="23" fill="#FFC66D" font-weight="400" text-anchor="start">★★★★★</text><text x="728" y="242" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">原建议：四星</text><text x="728" y="272" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">修改后：五星</text><text x="728" y="302" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">保留理由 / 人 / 时间</text><rect x="28" y="390" width="896" height="102" rx="8" fill="#111A26" stroke="#283448"/><text x="48" y="420" font-size="16" fill="#A8B6CB" font-weight="400" text-anchor="start">纪律 / 机会 / 仓位 / 体验分别保存状态与依据，不默认合成总星级。</text><text x="48" y="449" font-size="16" fill="#A8B6CB" font-weight="400" text-anchor="start">资料不足不等于中等表现；盈利不自动提升纪律星级。</text><text x="48" y="478" font-size="16" fill="#A8B6CB" font-weight="400" text-anchor="start">图中四星和五星仅演示来源差别；规则阈值仍待用户审阅。</text></g></svg>