<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" role="img" aria-label="IconButton 八态真实几何板"><rect width="1100" height="860" fill="#0B1019"/><text x="32" y="38" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24px" font-weight="600" fill="#E6EDF7" text-anchor="start">V2.1 原子板 · IconButton</text><text x="32" y="66" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#A8B6CB" text-anchor="start">每格为真实结构状态；visible 是视觉包络，hit 是可操作命中区。桌面 36px，Token/Retry/StatusBadge 例外按合同。</text><rect x="32" y="88" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="1"/><text x="48" y="112" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#6CA8FF" text-anchor="start">默认 · DEFAULT</text><text x="182" y="112" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#A8B6CB" text-anchor="start">visible 36×36 · hit 36×36</text><rect x="56" y="134" width="36" height="36" rx="6" fill="#111A26" stroke="#283448" stroke-width="1"/><path d="M66,151q8,-8 16,0q-8,8-16,0z" fill="none" stroke="#6CA8FF" stroke-width="1.5"/><circle cx="74" cy="151" r="2.5" fill="none" stroke="#6CA8FF"/><text x="108" y="154" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#E6EDF7" text-anchor="start">查看持仓详情</text><rect x="572" y="88" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="1"/><text x="588" y="112" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#6CA8FF" text-anchor="start">悬停 · HOVER</text><text x="722" y="112" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-se