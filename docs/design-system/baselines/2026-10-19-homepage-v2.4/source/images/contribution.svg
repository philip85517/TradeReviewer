<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700"><rect width="1440" height="700" fill="#0B1019"/><text x="48" y="50" fill="#E6EDF7" font-family="Arial" font-size="24" font-weight="700">贡献 · 当前期间 · 缺少必要估值</text><text x="48" y="78" fill="#A8B6CB" font-family="Arial" font-size="14">示例状态：当前期间 / 做多 / 全部市场；已实现按当前市场范围计算，浮盈变化暂不可计算</text><rect x="48" y="112" width="1344" height="500" rx="8" fill="#111A26" stroke="#283448"/><text x="76" y="146" fill="#E6EDF7" font-family="Arial" font-size="18" font-weight="700">当前期间贡献</text><text x="1328" y="146" text-anchor="end" fill="#FFC66D" font-family="Arial" font-size="14">部分可计算 · 已实现 +13,262 CNY</text><g font-family="Arial" font-size="14"><text x="76" y="242" fill="#E6EDF7">当前范围已实现贡献</text><rect x="548" y="224" width="280" height="16" rx="8" fill="#53D7A0"/><text x="1030" y="242" fill="#53D7A0">+13,262</text><text x="76" y="326" fill="#E6EDF7">期间浮盈变化</text><text x="1030" y="326" fill="#FFC66D">不可计算</text><text x="76" y="382" fill="#A8B6CB">已知的已实现贡献仍展示；缺少的浮盈变化不按 0 处理，也不混入历史已平仓统计。</text><text x="76" y="568" fill="#A8B6CB">示例状态随当前市场、分类和排序变化；页面入口使用同一计算规则</text></g></svg>
