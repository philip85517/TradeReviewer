<script>
(()=>{
const fixtures={live:{label:'实盘',heading:{list:'实盘交易',stats:'实盘统计'},dates:{list:'2026-10-01 至 2026-10-15',stats:'2026-10-01 至 2026-10-15'},dateLabels:{list:'成交日期',stats:'平仓日期'},account:'全部账户',metrics:[['有效回合','5'],['累计净盈亏','747.14'],['胜率','60.00%'],['平均盈利','351.88'],['平均亏损','-154.25'],['费用（已扣除）','22.86']],trend:[['10-03',48],['10-05',-4],['10-07',905.64],['10-09',1003.64],['10-12',747.14]],distribution:[['亏损 > 5%',1,'loss','20.00%'],['亏损 0–5%',1,'loss','20.00%'],['持平',0,'','0.00%'],['盈利 0–5%',2,'win','40.00%'],['盈利 > 5%',1,'win','20.00%']],distributionAmount:[['亏损 > 100',1,'loss','20.00%'],['亏损 0–100',1,'loss','20.00%'],['持平',0,'','0.00%'],['盈利 0–100',2,'win','40.00%'],['盈利 > 100',1,'win','20.00%']],rows:[['2026-10-02','招商银行','600036','买入','10','100.00','1.00','已复盘'],['2026-10-03','招商银行','600036','卖出','10','105.00','1.00','已复盘'],['2026-10-03','贵州茅台','600519','买入','100','1712.00','8.56','待复盘'],['2026-10-04','平安银行','000001','买入','10','100.00','1.00','已复盘'],['2026-10-05','平安银行','000001','卖出','10','95.00','1.00','已复盘'],['2026-10-07','贵州茅台','600519','卖出','40','1735.00','6.94','待复盘'],['2026-10-08','立讯精密','002475','买入','10','100.00','1.00','已复盘'],['2026-10-09','立讯精密','002475','卖出','10','110.00','1.00','已复盘'],['2026-10-09','宁德时代','300750','买入','50','219.00','3.29','已复盘'],['2026-10-12','宁德时代','300750','卖出','50','214.00','3.21','待复盘'],['2026-10-15','中芯国际','688981','买入','80','92.00','2.95','已复盘']]},simulation:{label:'模拟盘',heading:{list:'模拟盘练习',stats:'模拟盘统计'},dates:{list:'2026-10-15 至 2026-10-19',stats:'2026-10-15 至 2026-10-19'},dateLabels:{list:'练习保存日期',stats:'练习保存日期'},account:'模拟练习身份 · 不显示实盘账户',metrics:[['有效回合','7'],['累计净盈亏','2,272.00'],['总体胜率','71.43%'],['费用（已扣除）','33.00'],['做多胜率 · 5/7 样本','71.43%'],['做空胜率 · 无样本','—'],['平均盈利','490.80'],['平均亏损','-91.00']],trend:[['10-15',1982],['10-16',2336],['10-17',2258],['10-18',2154],['10-19',2272]],distribution:[['亏损 > 5%',0,'loss','0.00%'],['亏损 0–5%',2,'loss','28.57%'],['持平',0,'','0.00%'],['盈利 0–5%',1,'win','14.29%'],['盈利 > 5%',4,'win','57.14%']],distributionAmount:[['亏损 > 100',1,'loss','14.29%'],['亏损 0–100',1,'loss','14.29%'],['持平',0,'','0.00%'],['盈利 0–100',1,'win','14.29%'],['盈利 > 100',4,'win','57.14%']],exercises:[['2026-10-15','练习 A','贵州茅台','600519','3','2','70'],['2026-10-15','练习 E','贵州茅台','600519','2','1','0'],['2026-10-16','练习 C','平安银行','000001','2','1','0'],['2026-10-17','练习 D','宁德时代','300750','2','1','0'],['2026-10-18','练习 B','贵州茅台','600519','2','1','0'],['2026-10-19','练习 F','招商银行','600036','2','1','0']]}};
const q=new URLSearchParams(location.search);const state={variant:q.get('variant')==='E'?'E':'D',mode:'live',page:'list',preview:'normal',origin:'home',measure:'rate',date:{live:'fixture',simulation:'fixture'}};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function current(){return fixtures[state.mode]}function range(){return state.date[state.mode]==='long'?'2026-10-01 至 2026-10-31 · 扩展范围':current().dates[state.page]}function modeControls(){return `<div class="nav-controls"><span class="nav-label">视角</span><div class="mode ${state.mode==='simulation'?'sim-boundary':''}" id="mode-control" role="radiogroup" aria-label="交易库视角"><button id="mode-live" type="button" role="radio" aria-checked="${state.mode==='live'}" data-mode="live">实盘</button><button id="mode-simulation" type="button" role="radio" aria-checked="${state.mode==='simulation'}" data-mode="simulation">模拟盘</button></div></div>`}function tabs(){return `<div class="tabs" id="page-tabs" role="tablist" aria-label="交易库页面"><button id="page-list" type="button" role="tab" aria-selected="${state.page==='list'}" data-page="list">列表</button><button id="page-stats" type="button" role="tab" aria-selected="${state.page==='stats'}" data-page="stats">统计</button></div>`}
function header(){return ''}
function tools(){const c=current();return `<div class="tool-row"><div class="field date"><label for="date-range">${c.dateLabels[state.page]}</label><select id="date-range"><option value="fixture">${esc(c.dates[state.page])}</option><option value="long" ${state.date[state.mode]==='long'?'selected':''}>2026-10-01 至 2026-10-31 · 扩展范围</option></select></div><div class="field"><label>市场</label><div class="field-value">全部市场</div></div><div class="field"><label>账户 / 身份</label><div class="field-value">${esc(c.account)}</div></div></div>`}
function list(){const c=current();if(state.mode==='simulation')return `<div class="state"><div class="table-head"><span class="tag">${c.exercises.length} 次练习</span></div><div class="table-wrap"><table class="table"><thead><tr><th>保存日期</th><th>练习</th><th>标的</th><th>代码</th><th class="num">成交笔数</th><th class="num">已平仓回合</th><th class="num">未平仓数量</th></tr></thead><tbody>${c.exercises.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td class="num">${r[6]}</td></tr>`).join('')}</tbody></table></div></div>`;return `<div class="state"><div class="table-head"><span class="tag">${c.rows.length} 笔样例成交</span></div><div class="table-wrap"><table class="table"><thead><tr><th>成交日期</th><th>标的</th><th>代码</th><th>方向</th><th class="num">数量</th><th class="num">价格</th><th class="num">费用</th><th>状态</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td class="num">${r[6]}</td><td><span class="tag ${r[7]==='已复盘'?'green':'orange'}">${r[7]}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function stats(){const c=current(),values=c.metrics.map(m=>`<div class="metric"><span class="label">${m[0]}</span><strong class="value">${m[1]}</strong></div>`).join(''),v=c.trend,min=Math.min(0,...v.map(p=>p[1])),max=Math.max(0,...v.map(p=>p[1])),span=max-min||1,pts=v.map((p,i)=>({x:v.length===1?600:80+i*1040/(v.length-1),y:18+(max-p[1])/span*132,label:p[0],value:p[1]})),line=pts.map(p=>`${p.x},${p.y}`).join(' '),zero=18+(max/span)*132,d=state.measure==='amount'?c.distributionAmount:c.distribution,dm=Math.max(1,...d.map(x=>x[1])),rows=d.map(x=>`<div class="dist-row"><span>${x[0]}</span><span class="bar"><i class="${x[2]}" style="width:${x[1]/dm*100}%"></i></span><b>${x[1]}</b><b>${x[3]}</b></div>`).join(''),note=state.mode==='simulation'?'<p class="demo-message"><strong>最差练习回撤</strong>　—　定义与计算所需权益路径缺失，当前样例暂不可计算。<br>费用（已扣除）：已平仓回合的开仓分摊费与平仓费；已计入净盈亏，不含未平仓费用。</p>':'<p class="demo-message">费用（已扣除）：已平仓回合的开仓分摊费与平仓费；已计入净盈亏，不含未平仓费用。</p>';return `<div class="cards ${state.mode==='simulation'?'simulation-cards':''}">${values}</div>${note}<section class="panel"><h3>累计净盈亏趋势</h3><p>${c.dateLabels.stats} · 日</p><div class="chart"><svg viewBox="0 0 1200 188" role="img" aria-label="累计净盈亏折线图"><line class="zero" x1="80" y1="${zero}" x2="1120" y2="${zero}"/><polyline points="${line}"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4"><title>${p.label} · ${p.value.toFixed(2)} CNY</title></circle>`).join('')}<text x="80" y="180">${pts[0].label}</text><text x="1020" y="180">${pts[pts.length-1].label}</text></svg></div></section><section class="panel"><h3>收益分布 <span class="measure-toggle" role="group" aria-label="分布单位"><button id="measure-rate" type="button" data-measure="rate" aria-pressed="${state.measure==='rate'}">收益率</button><button id="measure-amount" type="button" data-measure="amount" aria-pressed="${state.measure==='amount'}">金额</button></span></h3><p>当前范围 · ${c.metrics[0][1]} 个有效回合 · 条长表示回合数</p><div class="dist"><div class="dist-row"><span>区间</span><span>频数</span><b>回合数</b><b>占比</b></div>${rows}</div></section>`}
function body(){if(state.preview==='loading')return `<div class="state loading"><div class="skeletons"><strong>正在加载样例</strong><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></div>`;if(state.preview==='empty')return `<div class="state empty"><div><strong>暂无${state.page==='list'?'记录':'统计样本'}</strong><p>当前日期和视角没有可展示的样例结果。</p></div></div>`;return state.page==='list'?list():stats()}
function render(){const focusId=document.activeElement&&document.activeElement.id;const app=$('app');app.className=`app variant-${state.variant.toLowerCase()}`;app.dir='ltr';$('variant-label').textContent=`方案 ${state.variant}`;if(state.variant==='D'){$('top-controls').innerHTML=`${modeControls()}${tabs()}`;$('sub-controls').innerHTML=''}else{$('top-controls').innerHTML='';$('sub-controls').innerHTML=`${modeControls()}${tabs()}`}$('return-btn').style.display=state.origin==='home'?'':'none';$('return-btn').textContent='返回首页';$('content').innerHTML=`${header()}${tools()}${body()}`;const ps=$('preview-select');if(ps)ps.value=state.preview;document.querySelectorAll('input[name=origin]').forEach(i=>i.checked=i.value===state.origin);bind();if(focusId){const next=$(focusId);if(next)next.focus()}}
function bind(){document.querySelectorAll('[data-mode]').forEach(b=>{b.onclick=()=>{state.mode=b.dataset.mode;render()};b.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const focusId=e.key==='ArrowLeft'?'mode-live':'mode-simulation';state.mode=e.key==='ArrowLeft'?'live':'simulation';render();const next=$(focusId);if(next)next.focus()}}});document.querySelectorAll('[data-page]').forEach(b=>{b.onclick=()=>{state.page=b.dataset.page;render()};b.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const focusId=e.key==='ArrowLeft'?'page-list':'page-stats';state.page=e.key==='ArrowLeft'?'list':'stats';render();const next=$(focusId);if(next)next.focus()}}});document.querySelectorAll('[data-measure]').forEach(b=>b.onclick=()=>{state.measure=b.dataset.measure;render()});const d=$('date-range');if(d)d.onchange=()=>{state.date[state.mode]=d.value;render()};const p=$('preview-select');if(p)p.onchange=()=>{state.preview=p.value;render()};document.querySelectorAll('input[name=origin]').forEach(i=>i.onchange=()=>{state.origin=i.value;render()});const b=$('return-btn');if(b)b.onclick=()=>{$('status').textContent='演示反馈：返回动作仅用于比较入口语义，不会离开样例页面。'}}function setVariant(v){state.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState({},'',u);render()}$('prev-variant').onclick=()=>setVariant(state.variant==='D'?'E':'D');$('next-variant').onclick=()=>setVariant(state.variant==='D'?'E':'D');document.addEventListener('keydown',e=>{const t=e.target; if(['INPUT','SELECT','TEXTAREA'].includes(t.tagName)||t.isContentEditable||t.closest('[role=radio],[role=tab]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const target=e.key==='ArrowLeft'?'D':'E';setVariant(target)}if(e.key==='1'||e.key==='2'){e.preventDefault();state.mode=e.key==='1'?'live':'simulation';render()}if(e.key==='l'||e.key==='L'){e.preventDefault();state.page='list';render()}if(e.key==='s'||e.key==='S'){e.preventDefault();state.page='stats';render()}});render();
})();
