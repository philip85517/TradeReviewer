<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240"><style>@media(prefers-reduced-motion:reduce){.pulse{display:none}}</style><rect width="960" height="240" rx="8" fill="#101722"/><text x="28" y="35" fill="#e7edf6" font-family="PingFang SC,sans-serif" font-size="16">设计动效：一次约200ms确认，随后持续选中（点击页面按钮可重播）</text><path d="M150 175L510 80" stroke="#7aa7dc" stroke-width="2"/><circle class="pulse" cx="150" cy="175" r="6" fill="none" stroke="#8cbdff"><animate attributeName="r" from="6" to="10" dur=".2s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur=".2s" fill="freeze"/></circle><circle cx="150" cy="175" r="4" fill="#101722" stroke="#8cbdff" stroke-width="2"/><circle class="pulse" cx="510" cy="80" r="6" fill="none" stroke="#8cbdff"><animate attributeName="r" from="6" to="10" dur=".2s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur=".2s" fill="freeze"/></circle><circle cx="510" cy="80" r="4" fill="#101722" stroke="#8cbdff" stroke-width="2"/><rect x="615" y="70" width="275" height="110" rx="4" fill="#142236" stroke="#8cbdff"/><rect class="pulse" x="615" y="70" width="275" height="110" rx="4" fill="none" stroke="#8cbdff"><animate attributeName="x" from="615" to="611" dur=".2s" fill="freeze"/><animate attributeName="y" from="70" to="66" dur=".2s" fill="freeze"/><animate attributeName="width" from="275" to="283" dur=".2s" fill="freeze"/><animate attributeName="height" from="110" to="118" dur=".2s" fill="freeze"/><animate attributeName="opacity" from="1" to="0" dur=".2s" fill="freeze"/></rect><text x="630" y="95" fill="#c1d5f1" font-family="PingFang SC,sans-serif" font-size="14">原始判断：</text><text x="630" y="121" fill="#c1d5f1" font-family="PingFang SC,sans-serif" font-size="14">回撤后观察承接，站回 56 再考虑做多。</text><text x="630" y="147" fill="#c1d5f1" font-family="PingFang SC,sans-serif" font-size="14">跌破 52 则结构失效。</text></svg>