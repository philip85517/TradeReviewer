<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>交易库 · D/E 导航比较</title>
<style>
:root{--bg:#0b111d;--nav:#111a29;--panel:#131d2c;--panel2:#182338;--line:#2a3850;--text:#edf3ff;--muted:#94a2b8;--quiet:#64738b;--blue:#82b5ff;--blue2:#a8cbff;--purple:#a78bfa;--purple-bg:rgba(167,139,250,.08);--green:#73d6a1;--red:#ef9a9a;--orange:#efc77b}*{box-sizing:border-box}html,body{margin:0;min-width:960px;background:var(--bg);color:var(--text);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid var(--blue2);outline-offset:2px}.app{min-height:100vh;padding-bottom:84px}.side{position:fixed;z-index:3;inset:0 auto 0 0;width:72px;background:var(--nav);border-right:1px solid #1d2a3c;display:flex;flex-direction:column;align-items:center}.brand{height:64px;width:100%;display:grid;place-items:center;color:var(--blue);font-size:19px;font-weight:750;border-bottom:1px solid #1d2a3c}.side-nav{display:grid;gap:10px;width:100%;padding-top:18px}.side-item{width:56px;margin:auto;padding:8px 2px;border-radius:9px;color:var(--muted);text-align:center;font-size:11px}.side-item .ico{display:block;font-size:20px;line-height:24px}.side-item.active{color:var(--blue);background:#192941}.side-foot{margin-top:auto;margin-bottom:20px;color:var(--quiet);font-size:10px}.top{height:64px;margin-left:72px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;background:#101827;border-bottom:1px solid #1d2a3c}.top-left{display:flex;align-items:center;gap:22px}.top h1{margin:0;font-size:24px;line-height:1;font-weight:700}.top-meta{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.return{min-height:36px;padding:7px 16px;border:1px solid var(--line);border-radius:8px;background:#172238;color:var(--text)}.main{margin-left:72px;padding:22px 24px 42px;max-width:1440px}.variant-d .subnav{display:contents}.variant-e .top{height:64px}.variant-e .top-left{gap:24px}.variant-e .subnav{display:flex;align-items:center;gap:18px;height:58px;margin:-22px -24px 18px;padding:0 24px;background:#101827;border-bottom:1px solid #1d2a3c}.variant-e .subnav .mode-label{display:none}.nav-controls{display:flex;align-items:center;gap:18px}.nav-label{color:var(--muted);font-size:12px}.mode{display:inline-flex;padding:3px;background:#111a29;border:1px solid var(--line);border-radius:9px;min-height:42px}.mode button{min-width:88px;min-height:34px;padding:5px 16px;border:0;background:transparent;border-radius:6px;color:var(--muted)}.mode button[aria-checked=true]{background:#223657;color:var(--blue2);font-weight:700;box-shadow:inset 0 0 0 1px #5d8fd2}.variant-e .mode{min-height:38px}.variant-e .mode button{min-height:30px}.tabs{display:inline-flex;gap:4px;min-height:42px;border-bottom:1px solid var(--line)}.tabs button{min-width:68px;min-height:40px;padding:5px 14px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--muted)}.tabs button[aria-selected=true]{color:var(--blue2);font-weight:700;border-bottom-color:var(--blue)}.subnav .tabs{margin-left:auto}.content-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:18px}.eyebrow{margin:0 0 4px;color:var(--muted);font-size:12px}.content-head h2{margin:0;font-size:22px;line-height:1.25}.context{color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}.context strong{color:var(--blue);font-weight:650}.tool-row{display:flex;align-items:end;gap:18px;flex-wrap:wrap;padding:15px 0 18px;border-top:1px solid #1d2a3c}.field{display:grid;gap:5px}.field label{color:var(--muted);font-size:12px}.field select,.field-value{min-height:36px;min-width:180px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#111a29}.field.date select{min-width:290px}.sim-boundary{padding:12px 14px;border:1px solid rgba(167,139,250,.75);border-radius:10px;background:var(--purple-bg)}.sim-boundary .mode-note{color:#d8cbff}.mode-note{font-size:12px;color:var(--muted);margin-left:3px}.source-choice{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.source-choice label{display:inline-flex;align-items:center;gap:4px}.state{min-height:420px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.table-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}.table-head h3,.panel h3{margin:0;font-size:18px}.table-head p,.panel p{margin:3px 0 0;color:var(--muted);font-size:12px}.table-wrap{overflow-x:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 12px;border-bottom:1px solid #26334a;text-align:left;white-space:nowrap}.table th{color:var(--muted);font-weight:500;font-size:12px}.table td.num,.table th.num{text-align:right}.tag{display:inline-flex;padding:3px 8px;border-radius:999px;background:#1c2a3f;color:var(--muted);font-size:12px}.tag.green{color:var(--green)}.tag.orange{color:var(--orange)}.cards{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:18px}.metric{padding:14px 15px;background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:90px}.metric .label{color:var(--muted);font-size:12px}.metric .value{display:block;margin-top:9px;font-size:25px;font-weight:700}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.panel{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px}.chart{height:188px;margin-top:12px}.chart svg{width:100%;height:100%}.chart text{fill:var(--quiet);font-size:11px}.chart .zero{stroke:#53637d;stroke-dasharray:4 4}.chart polyline{fill:none;stroke:var(--blue);stroke-width:2}.chart circle{fill:var(--blue2);stroke:#376eaf;stroke-width:3}.dist{display:grid;gap:10px;margin-top:16px}.dist-row{display:grid;grid-template-columns:110px 1fr 55px;gap:10px;align-items:center;color:var(--muted);font-size:12px}.bar{height:8px;border-radius:8px;background:#26334a;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:8px}.bar i.loss{background:var(--red)}.empty,.loading{min-height:350px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty strong,.loading strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}.skeletons{width:min(640px,90%);display:grid;gap:12px}.skeleton{height:48px;border-radius:8px;background:linear-gradient(90deg,#19263a,#283751,#19263a);background-size:200% 100%;animation:shine 1.2s linear infinite}@keyframes shine{to{background-position:-200% 0}}.demo-message{margin-top:14px;color:var(--quiet);font-size:12px}.compare{position:fixed;z-index:5;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid #354763;border-radius:12px;background:rgba(17,26,41,.96);box-shadow:0 14px 36px rgba(0,0,0,.3)}.compare button{width:32px;height:32px;padding:0;border:1px solid var(--line);border-radius:7px;background:#18253a}.compare .variant{min-width:84px;color:var(--blue2);font-weight:700;text-align:center}.compare small{color:var(--muted);white-space:nowrap}.status{min-height:18px;margin-top:6px;color:var(--muted);font-size:12px}.variant-e .content-head{margin-bottom:14px}@media(max-width:1240px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.main{padding-right:24px}}@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div id="app" class="app variant-d">
<aside class="side" aria-label="应用导航"><div class="brand">TR</div><nav class="side-nav"><div class="side-item"><span class="ico">⌂</span>首页</div><div class="side-item active"><span class="ico">▤</span>交易库</div><div class="side-item"><span class="ico">⌁</span>分析</div><div class="side-item"><span class="ico">◫</span>数据</div><div class="side-item"><span class="ico">↳</span>策略</div></nav><div class="side-foot">账户</div></aside>
<header class="top"><div class="top-left"><h1>交易库</h1><div id="top-controls"></div></div><div class="top-meta"><span id="origin-label">来源 · 首页</span><button class="return" id="return-btn" type="button">返回首页</button></div></header>
<main class="main"><div id="sub-controls" class="subnav"></div><section id="content"></section><div id="status" class="status" aria-live="polite"></div></main>
<div class="compare" aria-label="D/E 方案比较"><button id="prev-variant" type="button" aria-label="上一方案">←</button><span class="variant" id="variant-label">方案 D</span><button id="next-variant" type="button" aria-label="下一方案">→</button><small>原型 · 待确认</small></div>
</div>
<script>
(()=>{
const fixtures={live:{label:'实盘',heading:{list:'实盘交易',stats:'实盘统计'},dates:{list:'2026-10-15',stats:'2026-10-01 至 2026-10-15'},dateLabels:{list:'成交日期',stats:'平仓日期'},account:'全部账户',metrics:[['有效回合','5'],['累计净盈亏','747.14'],['胜率','60.00%'],['平均盈利','351.88'],['平均亏损','-154.25'],['费用（已扣除）','22.86']],rows:[['2026-10-02','招商银行 · 600036','买入','10','100.00','已复盘'],['2026-10-03','招商银行 · 600036','卖出','10','105.00','已复盘'],['2026-10-03','贵州茅台 · 600519','买入','100','1712.00','待复盘'],['2026-10-07','贵州茅台 · 600519','卖出','40','1735.00','待复盘'],['2026-10-15','中芯国际 · 688981','买入','80','92.00','已复盘']]},simulation:{label:'模拟盘',heading:{list:'模拟盘练习',stats:'模拟盘统计'},dates:{list:'2026-10-15 至 2026-10-19',stats:'2026-10-15 至 2026-10-19'},dateLabels:{list:'练习保存日期',stats:'练习保存日期'},account:'模拟练习身份 · 不显示实盘账户',metrics:[['有效回合','7'],['累计净盈亏','2,272.00'],['总体胜率','71.43%'],['费用（已扣除）','33.00'],['做多胜率','71.43%'],['最大回撤','—']],exercises:[['2026-10-15','练习 A · 贵州茅台','3 次记录','2 回合','70 股未平仓','待复盘'],['2026-10-15','练习 E · 贵州茅台','2 次记录','1 回合','—','已复盘'],['2026-10-16','练习 C · 平安银行','2 次记录','1 回合','—','已复盘'],['2026-10-18','练习 B · 贵州茅台','2 次记录','1 回合','—','待复盘']]}};
const q=new URLSearchParams(location.search);const state={variant:q.get('variant')==='E'?'E':'D',mode:'live',page:'list',preview:'normal',origin:'home',date:{live:'fixture',simulation:'fixture'}};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function current(){return fixtures[state.mode]}function range(){return state.date[state.mode]==='long'?'2026-10-01 至 2026-10-31 · 扩展范围':current().dates[state.page]}function modeControls(){return `<div class="nav-controls"><span class="nav-label">视角</span><div class="mode ${state.mode==='simulation'?'sim-boundary':''}" id="mode-control" role="radiogroup" aria-label="交易库视角"><button type="button" role="radio" aria-checked="${state.mode==='live'}" data-mode="live">实盘</button><button type="button" role="radio" aria-checked="${state.mode==='simulation'}" data-mode="simulation">模拟盘</button>${state.mode==='simulation'?'<span class="mode-note">模拟 · 样例边界</span>':''}</div></div>`}function tabs(){return `<div class="tabs" id="page-tabs" role="tablist" aria-label="交易库页面"><button type="button" role="tab" aria-selected="${state.page==='list'}" data-page="list">列表</button><button type="button" role="tab" aria-selected="${state.page==='stats'}" data-page="stats">统计</button></div>`}
function header(){const c=current();return `<div class="content-head"><div><p class="eyebrow">${state.page==='list'?'交易记录':'结果概览'} · ${c.label}</p><h2>${c.heading[state.page]}</h2></div><div class="context"><strong>${c.dateLabels[state.page]}</strong>　${range()}　·　${esc(c.account)}</div></div>`}
function tools(){const c=current();return `<div class="tool-row"><div class="field date"><label for="date-range">${c.dateLabels[state.page]}</label><select id="date-range"><option value="fixture">${esc(c.dates[state.page])}</option><option value="long" ${state.date[state.mode]==='long'?'selected':''}>2026-10-01 至 2026-10-31 · 扩展范围</option></select></div><div class="field"><label for="market">市场</label><select id="market"><option>全部市场</option><option>沪深 A 股</option></select></div><div class="field"><label for="account">账户 / 身份</label><div class="field-value">${esc(c.account)}</div></div><div class="field"><label for="preview-select">预览状态</label><select id="preview-select"><option value="normal" ${state.preview==='normal'?'selected':''}>正常</option><option value="loading" ${state.preview==='loading'?'selected':''}>加载中</option><option value="empty" ${state.preview==='empty'?'selected':''}>空结果</option></select></div><div class="source-choice" role="radiogroup" aria-label="进入来源"><span>进入来源</span><label><input type="radio" name="origin" value="home" ${state.origin==='home'?'checked':''}>首页</label><label><input type="radio" name="origin" value="direct" ${state.origin==='direct'?'checked':''}>直接进入</label></div></div>`}
function list(){const c=current();if(state.mode==='simulation'){return `<div class="state ${state.mode==='simulation'?'sim-boundary':''}"><div class="table-head"><div><h3>练习列表</h3><p>按练习保存日期；未平仓数量保留在记录中</p></div><span class="tag">${c.exercises.length} 项</span></div><div class="table-wrap"><table class="table"><thead><tr><th>${c.dateLabels.list}</th><th>练习</th><th>记录</th><th>已平仓回合</th><th>仓位提示</th><th>状态</th></tr></thead><tbody>${c.exercises.map(r=>`<tr>${r.map((v,i)=>`<td class="${i===3?'num':''}">${i===5?`<span class="tag ${v==='已复盘'?'green':'orange'}">${v}</span>`:esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}return `<div class="state"><div class="table-head"><div><h3>成交记录</h3><p>按成交日期；未平仓成交继续保留</p></div><span class="tag">${c.rows.length} 笔样例</span></div><div class="table-wrap"><table class="table"><thead><tr><th>${c.dateLabels.list}</th><th>标的</th><th>方向</th><th class="num">数量</th><th class="num">成交价</th><th>复盘状态</th></tr></thead><tbody>${c.rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i===3||i===4?'num':''}">${i===5?`<span class="tag ${v==='已复盘'?'green':'orange'}">${v}</span>`:esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function stats(){const c=current();const points=state.mode==='live'?[48,-4,905,1003,747]:[1982,2336,2258,2154,2272];return `<div class="cards">${c.metrics.map(m=>`<div class="metric"><span class="label">${esc(m[0])}</span><strong class="value">${esc(m[1])}</strong></div>`).join('')}</div><div class="grid2"><section class="panel"><h3>净盈亏趋势</h3><p>${c.dateLabels.stats} · 已平仓回合 · CNY</p><div class="chart"><svg viewBox="0 0 600 190" preserveAspectRatio="none" role="img" aria-label="净盈亏趋势样例"><line class="zero" x1="0" y1="108" x2="600" y2="108"/><polyline points="18,128 150,132 285,38 420,20 570,58"/>${points.map((_,i)=>`<circle cx="${18+i*138}" cy="${[128,132,38,20,58][i]}" r="4"/>`).join('')}<text x="10" y="177">10-03</text><text x="274" y="177">10-12</text><text x="535" y="177">${state.mode==='live'?'10-15':'10-19'}</text></svg></div></section><section class="panel"><h3>结果分布</h3><p>按比例 · 持平与缺失数据独立保留</p><div class="dist"><div class="dist-row"><span>亏损 0–5%</span><span class="bar"><i class="loss" style="width:${state.mode==='live'?20:29}%"></i></span><b>20%</b></div><div class="dist-row"><span>持平</span><span class="bar"><i style="width:0%"></i></span><b>0%</b></div><div class="dist-row"><span>盈利 0–5%</span><span class="bar"><i style="width:${state.mode==='live'?40:14}%"></i></span><b>${state.mode==='live'?'40':'14'}%</b></div><div class="dist-row"><span>盈利 &gt; 5%</span><span class="bar"><i style="width:${state.mode==='live'?20:57}%"></i></span><b>${state.mode==='live'?'20':'57'}%</b></div></div><p class="demo-message" title="模拟数据保留缺失值，不以零代替">模拟数据的最大回撤暂无可用值</p></section></div>`}
function body(){if(state.preview==='loading')return `<div class="state loading"><div class="skeletons"><strong>正在加载样例</strong><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></div>`;if(state.preview==='empty')return `<div class="state empty"><div><strong>暂无${state.page==='list'?'记录':'统计样本'}</strong><p>当前日期和视角没有可展示的样例结果。</p></div></div>`;return state.page==='list'?list():stats()}
function render(){const app=$('app');app.className=`app variant-${state.variant.toLowerCase()}`;app.dir='ltr';$('variant-label').textContent=`方案 ${state.variant}`;if(state.variant==='D'){$('top-controls').innerHTML=`${modeControls()}${tabs()}`;$('sub-controls').innerHTML=''}else{$('top-controls').innerHTML=`<button class="return" type="button" id="e-top-return">返回${state.origin==='home'?'首页':'来源'}</button>`;$('sub-controls').innerHTML=`${modeControls()}${tabs()}`}$('origin-label').textContent=state.origin==='home'?'来源 · 首页':'来源 · 直接进入';$('return-btn').textContent=state.origin==='home'?'返回首页':'返回来源';$('content').innerHTML=`${header()}${tools()}${body()}`;bind();}
function bind(){document.querySelectorAll('[data-mode]').forEach(b=>{b.onclick=()=>{state.mode=b.dataset.mode;render()};b.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();state.mode=e.key==='ArrowLeft'?'live':'simulation';render()}}});document.querySelectorAll('[data-page]').forEach(b=>{b.onclick=()=>{state.page=b.dataset.page;render()};b.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();state.page=e.key==='ArrowLeft'?'list':'stats';render()}}});const d=$('date-range');if(d)d.onchange=()=>{state.date[state.mode]=d.value;render()};const p=$('preview-select');if(p)p.onchange=()=>{state.preview=p.value;render()};document.querySelectorAll('input[name=origin]').forEach(i=>i.onchange=()=>{state.origin=i.value;render()});['return-btn','e-top-return'].forEach(id=>{const b=$(id);if(b)b.onclick=()=>{$('status').textContent='演示反馈：返回动作仅用于比较入口语义，不会离开样例页面。'}})}function setVariant(v){state.variant=v;const u=new URL(location.href);u.searchParams.set('variant',v);history.replaceState({},'',u);render()}$('prev-variant').onclick=()=>setVariant(state.variant==='D'?'E':'D');$('next-variant').onclick=()=>setVariant(state.variant==='D'?'E':'D');document.addEventListener('keydown',e=>{const t=e.target; if(['INPUT','SELECT','TEXTAREA'].includes(t.tagName)||t.isContentEditable||t.closest('[role=radio],[role=tab]'))return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const target=e.key==='ArrowLeft'?'D':'E';setVariant(target)}if(e.key==='1'||e.key==='2'){e.preventDefault();state.mode=e.key==='1'?'live':'simulation';render()}if(e.key==='l'||e.key==='L'){e.preventDefault();state.page='list';render()}if(e.key==='s'||e.key==='S'){e.preventDefault();state.page='stats';render()}});render();
})();
</script>
</body></html>
