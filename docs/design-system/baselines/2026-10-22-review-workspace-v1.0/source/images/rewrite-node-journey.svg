<svg xmlns="http://www.w3.org/2000/svg" width="952" height="505" viewBox="0 0 952 505" role="img" aria-labelledby="title desc"><title id="title">图 C · 沿节点连续推进，计划与评价各有时机</title><desc id="desc">动作迁移示意；真实图表可见变化与持久化仍须另行验收。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6CA8FF"/></marker></defs><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="950" height="503" rx="12" fill="#0B1019" stroke="#283448"/><text x="28" y="40" font-size="23" fill="#E6EDF7" font-weight="600" text-anchor="start">图 C · 沿节点连续推进，计划与评价各有时机</text><text x="28" y="70" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">动作迁移示意；真实图表可见变化与持久化仍须另行验收。</text><rect x="28" y="116" width="212" height="210" rx="8" fill="#111A26" stroke="#283448"/><text x="44" y="148" font-size="17" fill="#E6EDF7" font-weight="600" text-anchor="start">入场前置暂停</text><text x="44" y="184" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">M：上一完成 K</text><text x="44" y="214" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">X：成交之前</text><text x="44" y="244" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">右栏：计划</text><text x="44" y="274" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">不露实际成交</text><path d="M 241 220 H 255" fill="none" stroke="#6CA8FF" stroke-width="2" marker-end="url(#arrow)"/><rect x="256" y="116" width="212" height="210" rx="8" fill="#111A26" stroke="#283448"/><text x="272" y="148" font-size="17" fill="#E6EDF7" font-weight="600" text-anchor="start">继续揭示成交</text><text x="272" y="184" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">M：可保持不变</text><text x="272" y="214" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">X：到本次成交</text><text x="272" y="244" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">D：当前节点记录</text><text x="272" y="274" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">未收盘 K 仍隐藏</text><path d="M 469 220 H 483" fill="none" stroke="#6CA8FF" stroke-width="2" marker-end="url(#arrow)"/><rect x="484" y="116" width="212" height="210" rx="8" fill="#111A26" stroke="#283448"/><text x="500" y="148" font-size="17" fill="#E6EDF7" font-weight="600" text-anchor="start">普通播放 / 标注</text><text x="500" y="184" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">未到节点不换 D</text><text x="500" y="214" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">新 K 进入视野</text><text x="500" y="244" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">Text 编辑即暂停</text><text x="500" y="274" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">草稿与快照分开</text><path d="M 697 220 H 711" fill="none" stroke="#6CA8FF" stroke-width="2" marker-end="url(#arrow)"/><rect x="712" y="116" width="212" height="210" rx="8" fill="#111A26" stroke="#283448"/><text x="728" y="148" font-size="17" fill="#E6EDF7" font-weight="600" text-anchor="start">退出后置暂停</text><text x="728" y="184" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">X：到退出成交</text><text x="728" y="214" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">M：最后完成 K</text><text x="728" y="244" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">右栏：事实与评价</text><text x="728" y="274" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">部分退出不算回合结束</text><rect x="28" y="366" width="896" height="108" rx="8" fill="#111A26" stroke="#283448"/><text x="48" y="395" font-size="16" fill="#A8B6CB" font-weight="400" text-anchor="start">节点切换：暂停 + 显示当前节点 + 选中其记录；不以阶段按钮推进。</text><text x="48" y="424" font-size="16" fill="#A8B6CB" font-weight="400" text-anchor="start">同 K 多事件依稳定序号逐个处理；入场先停、退出后停。</text><text x="48" y="453" font-size="16" fill="#A8B6CB" font-weight="400" text-anchor="start">恢复：还原 M/X/D、观察窗口和已看后续来源，不重新默认到起点。</text></g></svg>