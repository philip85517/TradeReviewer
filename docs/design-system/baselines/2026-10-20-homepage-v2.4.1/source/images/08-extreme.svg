<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-label="08-extreme.svg"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}</style><rect width="1440" height="1000" fill="#0B1019"/><text x="64" y="52" font-size="24" fill="#E6EDF7" font-weight="600" text-anchor="start">交易库 / 统计</text><text x="64" y="78" font-size="14" fill="#6CA8FF" font-weight="600" text-anchor="start">统计</text><text x="64" y="104" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">极值样本：轴与原因仍可读</text><rect x="64" y="128" width="1312" height="54" rx="8" fill="#111A26" stroke="#283448"/><text x="88" y="162" font-size="14" fill="#E6EDF7" font-weight="600" text-anchor="start">实盘</text><text x="166" y="162" font-size="14" fill="#A8B6CB" font-weight="600" text-anchor="start">模拟盘</text><path d="M86 178 L126 178" fill="none" stroke="#6CA8FF" stroke-width="2"/><text x="1120" y="160" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="end">extreme</text><rect x="64" y="198" width="1312" height="58" rx="8" fill="#162233" stroke="#283448"/><text x="88" y="233" font-size="12" fill="#A8B6CB" font-weight="400" text-anchor="start">平仓日期</text><rect x="182" y="211" width="190" height="34" rx="8" fill="#111A26" stroke="#283448"/><text x="198" y="233" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="start">本年（2026-01-01—10-19）</text><text x="406" y="233" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="start">市场：全部</text><text x="552" y="233" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="start">排序：日期 ↓</text><text x="1292" y="233" font-size="12" fill="#53D7A0" font-weight="400" text-anchor="end">条件与列表同步 · 不改变原分布</text><rect x="64" y="278" width="824" height="388" rx="8" fill="#111A26" stroke="#283448"/><text x="88" y="310" font-size="16" fill="#E6EDF7" font-weight="600" text-anchor="start">实盘交易趋势 · 金额</text><text x="862" y="310" font-size