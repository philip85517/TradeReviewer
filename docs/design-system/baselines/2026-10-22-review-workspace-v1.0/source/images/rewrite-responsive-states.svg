<svg xmlns="http://www.w3.org/2000/svg" width="952" height="595" viewBox="0 0 952 595" role="img" aria-labelledby="title desc"><title id="title">图 D · 适配通过改变区域组合完成</title><desc id="desc">不缩字、不遮价格轴；桌面、窄屏与软键盘的不同职责。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6CA8FF"/></marker></defs><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="950" height="593" rx="12" fill="#0B1019" stroke="#283448"/><text x="28" y="40" font-size="23" fill="#E6EDF7" font-weight="600" text-anchor="start">图 D · 适配通过改变区域组合完成</text><text x="28" y="70" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">不缩字、不遮价格轴；桌面、窄屏与软键盘的不同职责。</text><text x="28" y="112" font-size="18" fill="#E6EDF7" font-weight="600" text-anchor="start">桌面节点输入</text><text x="28" y="137" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">左右参与布局</text><rect x="28" y="154" width="284" height="340" rx="8" fill="#111A26" stroke="#283448"/><rect x="36" y="162" width="268" height="35" rx="4" fill="#243247" stroke="#283448"/><text x="48" y="185" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="start">身份 / 保存 / 工作区关闭</text><rect x="36" y="206" width="46" height="226" rx="4" fill="#23334A" stroke="#283448"/><text x="59" y="235" font-size="12" fill="#E6EDF7" font-weight="400" text-anchor="middle">列表</text><rect x="88" y="206" width="130" height="226" rx="4" fill="#162C45" stroke="#283448"/><text x="153" y="316" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="middle">主图 + 轴</text><rect x="224" y="206" width="80" height="226" rx="4" fill="#243D3D" stroke="#283448"/><text x="264" y="285" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="middle">当前节点</text><text x="264" y="310" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="middle">记录</text><rect x="36" y="442" width="268" height="36" rx="4" fill="#243247" stroke="#283448"/><text x="170" y="466" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="middle">回放 / 工具：局部横向滚动</text><text x="334" y="112" font-size="18" fill="#E6EDF7" font-weight="600" text-anchor="start">390px 窄屏</text><text x="334" y="137" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">趋势区 + 单一内容</text><rect x="334" y="154" width="284" height="340" rx="8" fill="#111A26" stroke="#283448"/><rect x="342" y="162" width="268" height="35" rx="4" fill="#243247" stroke="#283448"/><text x="354" y="185" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="start">身份 / 保存 / 工作区关闭</text><rect x="342" y="206" width="268" height="114" rx="4" fill="#162C45" stroke="#283448"/><text x="476" y="250" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="middle">趋势概览高 220px（候选）</text><text x="476" y="276" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="middle">绘图区 306 + 轴 84</text><rect x="342" y="328" width="268" height="104" rx="4" fill="#243D3D" stroke="#283448"/><text x="476" y="365" font-size="15" fill="#E6EDF7" font-weight="400" text-anchor="middle">列表 / 记录互斥</text><text x="476" y="392" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="middle">完整内容可滚动</text><rect x="342" y="442" width="268" height="36" rx="4" fill="#243247" stroke="#283448"/><text x="476" y="466" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="middle">回放 / 工具：局部横向滚动</text><text x="640" y="112" font-size="18" fill="#E6EDF7" font-weight="600" text-anchor="start">软键盘打开</text><text x="640" y="137" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">当前字段优先</text><rect x="640" y="154" width="284" height="340" rx="8" fill="#111A26" stroke="#283448"/><rect x="648" y="162" width="268" height="35" rx="4" fill="#243247" stroke="#283448"/><text x="660" y="185" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="start">身份 / 保存 / 工作区关闭</text><rect x="648" y="206" width="268" height="30" rx="4" fill="#162C45" stroke="#283448"/><text x="782" y="227" font-size="13" fill="#E6EDF7" font-weight="400" text-anchor="middle">展开趋势概览</text><rect x="648" y="244" width="268" height="120" rx="4" fill="#243D3D" stroke="#283448"/><text x="664" y="274" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">当前字段与单位</text><text x="664" y="298" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">就近校验 / 完成输入</text><text x="664" y="322" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">不触发回放快捷键</text><rect x="648" y="372" width="268" height="106" rx="4" fill="#293144" stroke="#283448"/><text x="782" y="426" font-size="15" fill="#E6EDF7" font-weight="400" text-anchor="middle">软件键盘占用区域</text><text x="28" y="534" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">示意图不按设备像素等比例缩放；准确预算见第二章与第八章。</text><text x="28" y="558" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">输入时暂停并保留草稿，收起趋势后仍能恢复；物理触控尚未验证。</text></g></svg>