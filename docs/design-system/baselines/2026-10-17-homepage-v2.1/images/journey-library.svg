<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1366" viewBox="0 0 1500 1366" role="img" aria-label="F03 · 交易库交接：URL身份、刷新与返回"><g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" style="font-variant-numeric:tabular-nums"><rect x="0" y="0" width="1500" height="1366" rx="0" fill="#0B1019" stroke="#0B1019"/><text x="32" y="38" fill="#E6EDF7" font-size="24" font-weight="600">F03 · 交易库交接：URL身份、刷新与返回</text><text x="32" y="68" fill="#A8B6CB" font-size="14" font-weight="400">局部设计分镜 · 1 SVG 单位 = 1px；整页布局沿用主稿；注释位于控件之外。</text><rect x="24" y="96" width="690" height="600" rx="8" fill="#111A26" stroke="#283448"/><text x="48" y="132" fill="#6CA8FF" font-size="18" font-weight="600">首页入口</text><g transform="translate(48,160)"><text x="0" y="24" fill="#E6EDF7" font-size="18" font-weight="600">实盘 · 全部账户 · 美股</text><rect x="0" y="55" width="640" height="150" rx="8" fill="#111A26" stroke="#283448"/><text x="20" y="86" fill="#E6EDF7" font-size="16" font-weight="400">历史已平仓 · 2026 · USD</text><text x="20" y="120" fill="#E6EDF7" font-size="14" font-weight="400">38回合 · 待复盘 3</text><rect x="20" y="145" width="180" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="32" y="168" fill="#E6EDF7" font-size="13" font-weight="400">前往交易库复盘</text><text x="0" y="245" fill="#A8B6CB" font-size="13" font-weight="400">点击传入完整URL：</text><text x="0" y="268" fill="#A8B6CB" font-size="13" font-weight="400">/trades?queue=pending-review&amp;market=us&amp;scope=live</text><text x="0" y="291" fill="#A8B6CB" font-size="13" font-weight="400">&amp;accounts=all</text><text x="0" y="314" fill="#A8B6CB" font-size="13" font-weight="400">日期入口另用 /trades?date=2026-10-14</text><text x="0" y="337" fill="#A8B6CB" font-size="13" font-weight="400">&amp;market=us&amp;scope=live&amp;accounts=all</text></g><rect x="762" y="96" width="690" height="600" rx="8" fill="#111A26" stroke="#283448"/><text x="786" y="132" fill="#6CA8FF" font-size="18" font-weight="600">交易库直开 / 刷新</text><g transform="translate(786,160)"><text x="0" y="24" fill="#E6EDF7" font-size="18" font-weight="600">实盘 · 全部账户 · 美股</text><text x="0" y="68" fill="#E6EDF7" font-size="24" font-weight="600">交易库</text><rect x="0" y="95" width="130" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="12" y="118" fill="#E6EDF7" font-size="13" font-weight="400">待复盘 3</text><rect x="145" y="95" width="140" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="157" y="118" fill="#E6EDF7" font-size="13" font-weight="400">美股 · USD</text><rect x="300" y="95" width="110" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="312" y="118" fill="#E6EDF7" font-size="13" font-weight="400">实盘</text><rect x="0" y="155" width="640" height="48" rx="8" fill="#111A26" stroke="#283448"/><text x="16" y="185" fill="#E6EDF7" font-size="14" font-weight="400">MSFT · NASDAQ</text><rect x="500" y="161" width="120" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="512" y="184" fill="#E6EDF7" font-size="13" font-weight="400">去复盘</text><rect x="0" y="207" width="640" height="48" rx="8" fill="#111A26" stroke="#283448"/><text x="16" y="237" fill="#E6EDF7" font-size="14" font-weight="400">AAPL · NASDAQ</text><rect x="500" y="213" width="120" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="512" y="236" fill="#E6EDF7" font-size="13" font-weight="400">去复盘</text><rect x="0" y="259" width="640" height="48" rx="8" fill="#111A26" stroke="#283448"/><text x="16" y="289" fill="#E6EDF7" font-size="14" font-weight="400">SPY · ARCA</text><rect x="500" y="265" width="120" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="512" y="288" fill="#E6EDF7" font-size="13" font-weight="400">去复盘</text><text x="0" y="350" fill="#A8B6CB" font-size="13" font-weight="400">URL 是直开/刷新权威；读取同一市场、账户和队列。</text><text x="0" y="373" fill="#A8B6CB" font-size="13" font-weight="400">不从上一页面内存推测 market。空队列显示0项而非旧数量。</text></g><rect x="24" y="720" width="690" height="600" rx="8" fill="#111A26" stroke="#283448"/><text x="48" y="756" fill="#6CA8FF" font-size="18" font-weight="600">非法市场参数</text><g transform="translate(48,784)"><text x="0" y="24" fill="#E6EDF7" font-size="18" font-weight="600">实盘 · 全部账户 · 全部市场</text><rect x="0" y="60" width="640" height="80" rx="8" fill="#162233" stroke="#283448"/><text x="16" y="88" fill="#FFC66D" font-size="13" font-weight="400">无法识别 market=xyz；已改为全部市场。</text><text x="16" y="111" fill="#FFC66D" font-size="13" font-weight="400">其余合法 scope、accounts、date / queue 保留。</text><rect x="0" y="170" width="150" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="12" y="193" fill="#E6EDF7" font-size="13" font-weight="400">全部 · CNY</text><text x="0" y="240" fill="#A8B6CB" font-size="13" font-weight="400">URL规范化 market=all；未知scope回live并解释。</text><text x="0" y="263" fill="#A8B6CB" font-size="13" font-weight="400">非法日期忽略该过滤条件并提示，不能查询错误日期。</text></g><rect x="762" y="720" width="690" height="600" rx="8" fill="#111A26" stroke="#283448"/><text x="786" y="756" fill="#6CA8FF" font-size="18" font-weight="600">返回首页</text><g transform="translate(786,784)"><text x="0" y="24" fill="#E6EDF7" font-size="18" font-weight="600">实盘 · 全部账户 · 美股</text><text x="0" y="70" fill="#E6EDF7" font-size="18" font-weight="400">首页 · 今年至今 · 美股 USD</text><rect x="0" y="95" width="640" height="150" rx="8" fill="#111A26" stroke="#283448"/><text x="16" y="125" fill="#E6EDF7" font-size="16" font-weight="400">历史已平仓 · 2026</text><rect x="16" y="155" width="180" height="36" rx="6" fill="#162233" stroke="#6CA8FF"/><text x="28" y="178" fill="#E6EDF7" font-size="13" font-weight="400">前往交易库复盘</text><rect x="13" y="152" width="186" height="42" rx="8" fill="none" stroke="#A9C8FF" stroke-width="2"/><text x="0" y="290" fill="#A8B6CB" font-size="13" font-weight="400">浏览器返回：恢复原期间、市场、账户、筛选与滚动位置。</text><text x="0" y="313" fill="#A8B6CB" font-size="13" font-weight="400">焦点回来源入口；入口移除则回历史区标题。</text><text x="0" y="336" fill="#A8B6CB" font-size="13" font-weight="400">复制链接不携带首页滚动状态；直开回首页使用首页默认值。</text></g><text x="32" y="1354" fill="#A8B6CB" font-size="12" font-weight="400">静态设计合同；请求、焦点、返回与持久化仍需后续产品实现验收。</text></g></svg>