<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1100" viewBox="0 0 1100 1100" role="img" aria-label="IconButton V2.2 八态"><rect width="1100" height="1100" fill="#0B1019"/><text x="32" y="38" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24px" font-weight="600" fill="#E6EDF7" text-anchor="start">图标按钮 · 八种状态</text><text x="32" y="66" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#A8B6CB" text-anchor="start">每格展示一种状态；不适用时说明原因。完整操作过程见对应模块分镜。</text><g id="default"><rect x="32" y="100" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="1"/><text x="48" y="124" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#6CA8FF" text-anchor="start">默认</text><text x="182" y="124" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#A8B6CB" text-anchor="start">外观 36×36 · 命中 36×36</text><rect x="56" y="146" width="36" height="36" rx="6" fill="#111A26" stroke="#283448" stroke-width="1"/><path d="M66,163q8,-8 16,0q-8,8-16,0z" fill="none" stroke="#6CA8FF" stroke-width="1.5"/><circle cx="74" cy="163" r="2.5" fill="none" stroke="#6CA8FF"/><text x="108" y="166" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#E6EDF7" text-anchor="start">查看持仓详情</text></g><g id="hover"><rect x="572" y="100" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="1"/><text x="588" y="124" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#6CA8FF" text-anchor="start">悬停</text><text x="722" y="124" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#A8B6CB" text-anchor="start">外观 36×36 · 命中 36×36</text><rect x="596" y="146" width="36" height="36" rx="6" fill="#1C2B42" stroke="#283448" stroke-width="1"/><path d="M606,163q8,-8 16,0q-8,8-16,0z" fill="none" stroke="#6CA8FF" stroke-width="1.5"/><circle cx="614" cy="163" r="2.5" fill="none" stroke="#6CA8FF"/><text x="648" y="166" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#E6EDF7" text-anchor="start">悬停 300ms → 提示框</text></g><g id="focus"><rect x="32" y="345" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="2"/><text x="48" y="369" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#6CA8FF" text-anchor="start">聚焦</text><text x="182" y="369" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#A8B6CB" text-anchor="start">外观 36×36 · 命中 36×36</text><rect x="56" y="391" width="36" height="36" rx="6" fill="#111A26" stroke="#A9C8FF" stroke-width="2"/><path d="M66,408q8,-8 16,0q-8,8-16,0z" fill="none" stroke="#6CA8FF" stroke-width="1.5"/><circle cx="74" cy="408" r="2.5" fill="none" stroke="#6CA8FF"/><text x="108" y="411" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#E6EDF7" text-anchor="start">焦点环 2px 外偏 2px</text></g><g id="pressed"><rect x="572" y="345" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="1"/><text x="588" y="369" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#6CA8FF" text-anchor="start">按下</text><text x="722" y="369" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#A8B6CB" text-anchor="start">外观 36×36 · 命中 36×36</text><rect x="596" y="391" width="36" height="36" rx="6" fill="#243B5C" stroke="#283448" stroke-width="1"/><path d="M606,408q8,-8 16,0q-8,8-16,0z" fill="none" stroke="#6CA8FF" stroke-width="1.5"/><circle cx="614" cy="408" r="2.5" fill="none" stroke="#6CA8FF"/><text x="648" y="411" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#E6EDF7" text-anchor="start">已触发查看</text></g><g id="disabled"><rect x="32" y="590" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="1"/><text x="48" y="614" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#6CA8FF" text-anchor="start">禁用</text><text x="182" y="614" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#A8B6CB" text-anchor="start">外观 36×36 · 命中 36×36</text><rect x="56" y="636" width="36" height="36" rx="6" fill="#111A26" stroke="#283448" stroke-width="1"/><path d="M66,653q8,-8 16,0q-8,8-16,0z" fill="none" stroke="#A8B6CB" stroke-width="1.5"/><circle cx="74" cy="653" r="2.5" fill="none" stroke="#A8B6CB"/><text x="108" y="656" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#A8B6CB" text-anchor="start">不可用 · 权限不足</text></g><g id="loading"><rect x="572" y="590" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="1"/><text x="588" y="614" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#6CA8FF" text-anchor="start">加载</text><text x="722" y="614" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#A8B6CB" text-anchor="start">外观 36×36 · 命中 36×36</text><rect x="596" y="636" width="36" height="36" rx="6" fill="#111A26" stroke="#283448" stroke-width="1"/><path d="M621,652a7,7 0 1 0 0,5M621,647v5h-5" fill="none" stroke="#6CA8FF" stroke-width="1.7" stroke-linecap="round"/><text x="648" y="656" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#E6EDF7" text-anchor="start">更新中 · 状态环</text></g><g id="empty"><rect x="32" y="835" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="1"/><text x="48" y="859" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#A8B6CB" text-anchor="start">空</text><text x="182" y="859" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#A8B6CB" text-anchor="start">外观 36×36 · 命中 36×36</text><text x="56" y="925" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16px" font-weight="600" fill="#A8B6CB" text-anchor="start">不适用</text><text x="56" y="949" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#71829B" text-anchor="start">图标动作始终有明确动作名；没有空 内容 状态</text></g><g id="error"><rect x="572" y="835" width="520" height="188" rx="8" fill="#162233" stroke="#283448" stroke-width="1"/><text x="588" y="859" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="600" fill="#6CA8FF" text-anchor="start">错误</text><text x="722" y="859" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11px" font-weight="400" fill="#A8B6CB" text-anchor="start">外观 36×36 · 命中 36×36</text><rect x="596" y="881" width="36" height="36" rx="6" fill="#111A26" stroke="#283448" stroke-width="1"/><path d="M606,898q8,-8 16,0q-8,8-16,0z" fill="none" stroke="#6CA8FF" stroke-width="1.5"/><circle cx="614" cy="898" r="2.5" fill="none" stroke="#6CA8FF"/><text x="648" y="901" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12px" font-weight="400" fill="#E6EDF7" text-anchor="start">错误 · 查看原因</text></g></svg>
