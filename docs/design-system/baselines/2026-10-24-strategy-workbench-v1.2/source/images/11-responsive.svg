ans-serif;font-size:14px;font-weight:400;fill:#E6EDF7;">回放槽 · 查看 / 播放 / 单步 / 速度</text><text x="102" y="1004" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:400;fill:#A8B6CB;">检查区实际宽度 320px；分区宽度在此仅示意。</text><rect x="790" y="156" width="412" height="1004" rx="8" fill="#111A26" stroke="#283448"/><text x="814" y="190" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:18px;font-weight:600;fill:#E6EDF7;">窄屏 · 390px</text><rect x="814" y="218" width="364" height="108" rx="8" fill="#111A26" stroke="#283448"/><text x="838" y="258" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:400;fill:#E6EDF7;">四项摘要 · 两列重排</text><rect x="814" y="350" width="364" height="64" rx="8" fill="#111A26" stroke="#283448"/><text x="838" y="388" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:400;fill:#E6EDF7;">工作模式与查看日</text><rect x="814" y="438" width="364" height="360" rx="8" fill="#111A26" stroke="#283448"/><text x="838" y="468" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:16px;font-weight:600;fill:#E6EDF7;">净值 / 标的 K 线</text><rect x="838" y="494" width="316" height="280" rx="8" fill="#0B1019" stroke="#283448"/><text x="862" y="640" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:400;fill:#6CA8FF;">净绘图区最低 280px</text><rect x="814" y="822" width="364" height="112" rx="8" fill="#111A26" stroke="#283448"/><text x="838" y="866" text-anchor="start" style="font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;font-size:14px;font-weight:400;fill:#E