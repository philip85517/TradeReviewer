<svg xmlns="http://www.w3.org/2000/svg" width="952" height="540" viewBox="0 0 952 540" role="img" aria-labelledby="title desc"><title id="title">图 A · 全幅工作区的空间预算</title><desc id="desc">不扣应用导航与外边距；主绘图区不含价格轴、两侧分隔。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#6CA8FF"/></marker></defs><g font-family="system-ui, -apple-system, PingFang SC, Microsoft YaHei, sans-serif"><rect x="1" y="1" width="950" height="538" rx="12" fill="#0B1019" stroke="#283448"/><text x="28" y="40" font-size="23" fill="#E6EDF7" font-weight="600" text-anchor="start">图 A · 全幅工作区的空间预算</text><text x="28" y="70" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="start">不扣应用导航与外边距；主绘图区不含价格轴、两侧分隔。</text><text x="28" y="106" font-size="18" fill="#E6EDF7" font-weight="600" text-anchor="start">1440×900 · 双侧展开 · 主区高 756px</text><rect x="28" y="124" width="139.3777777777778" height="56" rx="0" fill="#23334A" stroke="#283448"/><text x="97.6888888888889" y="147" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="middle">左列表</text><text x="97.6888888888889" y="168" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="middle">224</text><rect x="167.3777777777778" y="124" width="8.711111111111112" height="56" rx="0" fill="#283448" stroke="#283448"/><rect x="176.0888888888889" y="124" width="490.31111111111113" height="56" rx="0" fill="#162C45" stroke="#283448"/><text x="421.24444444444447" y="147" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="middle">主绘图区</text><text x="421.24444444444447" y="168" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="middle">788</text><rect x="666.4000000000001" y="124" width="59.733333333333334" height="56" rx="0" fill="#2B3450" stroke="#283448"/><text x="696.2666666666668" y="147" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="middle">价格轴</text><text x="696.2666666666668" y="168" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="middle">96</text><rect x="726.1333333333334" y="124" width="8.711111111111112" height="56" rx="0" fill="#283448" stroke="#283448"/><rect x="734.8444444444445" y="124" width="189.15555555555557" height="56" rx="0" fill="#243D3D" stroke="#283448"/><text x="829.4222222222223" y="147" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="middle">右编辑栏</text><text x="829.4222222222223" y="168" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="middle">304</text><text x="28" y="206" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">224 + 14 + 788 + 96 + 14 + 304 = 1440px</text><text x="28" y="264" font-size="18" fill="#E6EDF7" font-weight="600" text-anchor="start">1280×800 · 左侧收起 · 主区高 656px</text><rect x="28" y="282" width="28.0" height="56" rx="0" fill="#23334A" stroke="#283448"/><rect x="56.0" y="282" width="9.799999999999999" height="56" rx="0" fill="#283448" stroke="#283448"/><rect x="65.8" y="282" width="568.4" height="56" rx="0" fill="#162C45" stroke="#283448"/><text x="350.0" y="305" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="middle">主绘图区</text><text x="350.0" y="326" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="middle">812</text><rect x="634.1999999999999" y="282" width="67.19999999999999" height="56" rx="0" fill="#2B3450" stroke="#283448"/><text x="667.8" y="305" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="middle">价格轴</text><text x="667.8" y="326" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="middle">96</text><rect x="701.3999999999999" y="282" width="9.799999999999999" height="56" rx="0" fill="#283448" stroke="#283448"/><rect x="711.1999999999998" y="282" width="212.79999999999998" height="56" rx="0" fill="#243D3D" stroke="#283448"/><text x="817.5999999999998" y="305" font-size="14" fill="#E6EDF7" font-weight="400" text-anchor="middle">右编辑栏</text><text x="817.5999999999998" y="326" font-size="14" fill="#A8B6CB" font-weight="400" text-anchor="middle">304</text><text x="28" y="364" font-size="15" fill="#A8B6CB" font-weight="400" text-anchor="start">40 + 14 + 812 + 96 + 14 + 304 = 1280px</text><text x="28" y="410" font-size="16" fill="#A8B6CB" font-weight="400" text-anchor="start">两栏并排下限 1292 = 224 + 14 + 640 + 96 + 14 + 304</text><text x="28" y="434" font-size="16" fill="#A8B6CB" font-weight="400" text-anchor="start">1280 若强留双栏：绘图区 628；收左栏后：812。</text><text x="28" y="458" font-size="16" fill="#A8B6CB" font-weight="400" text-anchor="start">高度 = H − 顶栏52 − 信息行32 − 回放60；信息换行后按实占高重算。</text><text x="28" y="505" font-size="14" fill="#FFC66D" font-weight="400" text-anchor="start">本轮候选尺寸 · 比例条只解释预算，不代表已实现的 UI</text></g></svg>