name: ${COMPOSE_PROJECT_NAME:-tradereview}

services:
  app:
    restart: unless-stopped
    build:
      context: ${APP_RELEASE_CONTEXT:-./app/current}
      dockerfile: deploy/Dockerfile
    env_file:
      - ./config/.env
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    volumes:
      - ./data/sqlite:/var/lib/tradereview
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/storage/status').then(async (response) => { if (!response.ok) process.exit(1); const body = await response.json(); if (!Number.isInteger(body.schemaVersion) || !body.counts || typeof body.counts !== 'object') process.exit(1); }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
