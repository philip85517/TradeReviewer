<svg data-asset="search-overlay-closed" data-source="component-manual.html" data-source-sha256="4c8f607c13519559be179a8abf558b4deec0ed82e43f1d00eda2114a19237943" data-status="NOT_ACCEPTED" xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1100 820" role="img" aria-label="全屏搜索遮罩关闭状态"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}</style><rect width="1100" height="820" fill="#0B1019"/><rect x="40" y="32" width="1020" height="64" rx="8" fill="#162233" stroke="#283448"/><text x="64" y="71" font-size="18" fill="#E6EDF7">首页页头 · 搜索入口</text><rect x="40" y="120" width="1020" height="610" rx="8" fill="#111A26" stroke="#283448"/><text x="64" y="168" font-size="22" fill="#E6EDF7">首页局部（搜索遮罩关闭）</text><text x="64" y="204" font-size="14" fill="#A8B6CB">底层局部可操作；点击页头搜索入口后打开全屏遮罩。</text><rect x="64" y="250" width="300" height="120" rx="8" fill="#162233" stroke="#283448"/><text x="88" y="292" font-size="16" fill="#E6EDF7">局部内容卡片</text><text x="88" y="324" font-size="13" fill="#A8B6CB">仅作批准首页局部示意</text><rect x="392" y="250" width="300" height="120" rx="8" fill="#162233" stroke="#283448"/><text x="416" y="292" font-size="16" fill="#E6EDF7">局部内容卡片</text><text x="416" y="324" font-size="13" fill="#A8B6CB">未展开其他首页模块</text><rect x="720" y="250" width="284" height="120" rx="8" fill="#162233" stroke="#283448"/><text x="744" y="292" font-size="16" fill="#E6EDF7">搜索入口</text><text x="744" y="324" font-size="13" fill="#A8B6CB">状态：关闭</text><line x1="64" y1="430" x2="1036" y2="430" stroke="#283448"/><text x="64" y="476" font-size="16" fill="#E6EDF7">省略：完整首页内容、表格数据与其他模块</text><text x="64" y="510" font-size="13" fill="#A8B6CB">本帧只表达关闭态与入口位置，不代表完整产品页面。</text><text x="40" y="792" font-size="12" fill="#A8B6CB">搜索遮罩关闭状态 · 单帧示例</text><metadata>搜索遮罩关闭 · 底层恢复; 同一 960px 全屏搜索遮罩几何；非产品运行截图。</metadata></svg>