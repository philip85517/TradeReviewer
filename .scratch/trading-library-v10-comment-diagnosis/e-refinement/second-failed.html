function header(){return ''}
function tools(){const c=current();return `<div class="tool-row"><div class="field date"><label for="date-range">${c.dateLabels[state.page]}</label><select id="date-range"><option value="fixture">${esc(c.dates[state.page])}</option><option value="long" ${state.date[state.mode]==='long'?'selected':''}>2026-10-01 至 2026-10-31 · 扩展范围</option></select></div><div class="field"><label>市场</label><div class="field-value">全部市场</div></div><div class="field"><label>账户 / 身份</label><div class="field-value">${esc(c.account)}</div></div></div>`}
function list(){const c=current();if(state.mode==='simulation')return `<div class="state"><div class="table-head"><span class="tag">${c.exercises.length} 次练习</span></div><div class="table-wrap"><table class="table"><thead><tr><th>保存日期</th><th>练习</th><th>标的</th><th>代码</th><th class="num">成交笔数</th><th class="num">已平仓回合</th><th class="num">未平仓数量</th></tr></thead><tbody>${c.exercises.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td class="num">${r[6]}</td></tr>`).join('')}</tbody></table></div></div>`;return `<div class="state"><div class="table-head"><span class="tag">${c.rows.length} 笔样例成交</span></div><div class="table-wrap"><table class="table"><thead><tr><th>成交日期</th><th>标的</th><th>代码</th><th>方向</th><th class="num">数量</th><th class="num">价格</th><th class="num">费用</th><th>状态</th></tr></thead><tbody>${c.rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td class="num">${r[4]}</td><td class="num">${r[5]}</td><td class="num">${r[6]}</td><td><span class="tag ${r[7]==='已复盘'?'green':'orange'}">${r[7]}</span></td></tr>`).join('')}</tbody></table></div></div>`}
function stats(){const c=current(),values=c.metrics.map(m=>`<div class="metric"><span class="label">${m[0]}</span><strong class="value ${String(m[1]).startsWith("-")?"negative":((!m[0].includes("率")&&!m[0].includes("费用")&&m[1]!=="—")?"positive":"")}">${m[1]}</strong></div>`).join(''),v=c.trend,min=Math.min(0,...v.map(p=>p[1])),max=Math.max(0,...v.map(p=>p[1])),span=max-min||1,pts=v.map((p,i)=>({x:v.length===1?600:80+i*1040/(v.length-1),y:18+(max-p[1])/span*132,label:p[0],value:p[1]})),line=pts.map(p=>`${p.x},${p.y}`).join(' '),zero=18+(max/span)*132,d=state.measure==='amount'?c.distributionAmount:c.distribution,dm=Math.max(1,...d.map(x=>x[1])),rows=d.map(x=>`<div class="dist-row"><span>${x[0]}</span><span class="bar"><i class="${x[2]}" style="width:${x[1]/dm*100}%"></i></span><b>${x[1]}</b><b>${x[3]}</b></div>`).join(''),note=state.mode==='simulation'?'<p class="demo-message"><span class="help-wrap" data-help="drawdown-help"><span class="help-label">最差练习回撤　—</span><button class="help-icon" id="drawdown-help" type="button" aria-label="最差练习回撤说明" aria-expanded="false">i</button><span class="help-popover" role="tooltip" hidden><strong>最差练习回撤</strong>当前样例缺少权益路径，因此保留 —，不编造数值。</span></span></p>':'';return `<div class="cards ${state.mode==='simulation'?'simulation-cards':''}">${values}</div>${note}<section class="panel"><h3>累计净盈亏趋势</h3><p>${c.dateLabels.stats} · 日</p><div class="chart"><svg viewBox="0 0 1200 188" role="img" aria-label="累计净盈亏折线图"><line class="zero" x1="80" y1="${zero}" x2="1120" y2="${zero}"/><polyline points="${line}"/>${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="4"><title>${p.label} · ${p.value.toFixed(2)} CNY</title></circle>`).join('')}<text x="80" y="180">${pts[0].label}</text><text x="1020" y="180">${pts[pts.length-1].label}</text></svg></div></section><section class="panel"><h3>收益分布 <span class="measure-toggle" role="group" aria-label="分布单位"><button id="measure-rate" type="button" data-measure="rate" aria-pressed="${state.measure==='rate'}">收益率</button><button id="measure-amount" type="button" data-measure="amount" aria-pressed="${state.measure==='amount'}">金额</button></span></h3><p>当前范围 · ${c.metrics[0][1]} 个有效回合 · 条长表示回合数</p><div class="dist"><div class="dist-row"><span>区间</span><span>频数</span><b>回合数</b><b>占比</b></div>${rows}</div></section>`}
function body(){if(state.preview==='loading')return `<div class="state loading"><div class="skeletons"><strong>正在加载样例</strong><span class="skeleton"></span><span class="skeleton"></span><span class="skeleton"></span></div></div>`;if(state.preview==='empty')return `<div class="state empty"><div><strong>暂无${state.page==='list'?'记录':'统计样本'}</strong><p>当前日期和账户模式没有可展示的样例结果。</p></div></div>`;return state.page==='list'?list():stats()}
function render(){const focusId=document.activeElement&&document.activeElement.id;const app=$('app');app.className='app variant-e';app.dataset.mode=state.mode;app.dir='ltr';$('sub-controls').innerHTML=`${modeControls()}${tabs()}`;$('top-controls').innerHTML='';$('content').innerHTML=`${header()}${tools()}${body()}`;if(state.page==='stats'){const note=document.querySelector('.demo-message');if(note&&!document.getElementById('drawdown-help'))note.insertAdjacentHTML('afterbegin',`<span class="help-wrap" data-help="drawdown-help"><span class="help-label">最差练习回撤</span><button class="help-icon" id="drawdown-help" type="button" aria-label="最差练习回撤说明" aria-expanded="false">i</button><span class="help-popover" role="tooltip" hidden><strong>最差练习回撤</strong>定义为所选练习中最大的单次权益回撤。当前样例缺少权益路径，因此保留 —，不编造数值。</span></span>`);document.querySelectorAll('.panel h3').forEach((h,i)=>{if(!h.querySelector('.help-wrap'))h.insertAdjacentHTML('beforeend',` <span class="help-wrap" data-help="panel-help-${i}"><span class="help-label">指标说明</span><button class="help-icon" type="button" aria-label="指标说明" aria-expanded="false">i</button><span class="help-popover" role="tooltip" hidden><strong>指标说明</strong>本指标按当前日期范围和当前账户模式计算。</span></span>`)})}const ps=$('preview-select');if(ps)ps.value=state.preview;bind();if(focusId){const next=$(focusId);if(next)next.focus()}}
function bind(){document.querySelectorAll('[data-mode]').forEach(b=>{b.onclick=()=>{state.mode=b.dataset.mode;render()};b.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const focusId=e.key==='ArrowLeft'?'mode-live':'mode-simulation';state.mode=e.key==='ArrowLeft'?'live':'simulation';render();const next=$(focusId);if(next)next.focus()}}});document.querySelectorAll('[data-page]').forEach(b=>{b.onclick=()=>{state.page=b.dataset.page;render()};b.onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const focusId=e.key==='ArrowLeft'?'page-list':'page-stats';state.page=e.key==='ArrowLeft'?'list':'stats';render();const next=$(focusId);if(next)next.focus()}}});document.querySelectorAll('[data-measure]').forEach(b=>b.onclick=()=>{state.measure=b.dataset.measure;render()});const d=$('date-range');if(d)d.onchange=()=>{state.date[state.mode]=d.value;render()};const p=$('preview-select');if(p)p.onchange=()=>{state.preview=p.value;render()};document.querySelectorAll('.help-wrap').forEach(w=>{const b=w.querySelector('.help-icon');w.addEventListener('mouseenter',()=>openHelp(w));w.addEventListener('mouseleave',()=>closeHelp(w));b.onclick=e=>{e.stopPropagation();w.classList.toggle('is-open');b.setAttribute('aria-expanded',w.classList.contains('is-open'))};b.onfocus=()=>openHelp(w);b.onblur=()=>closeHelp(w)});document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.help-wrap.is-open').forEach(closeHelp)});function openHelp(w){w.classList.add('is-open');const p=w.querySelector('.help-popover'),b=w.querySelector('.help-icon');if(p)p.hidden=false;if(b){b.setAttribute('aria-expanded','true');if(p)b.setAttribute('aria-describedby',p.id||'help-popover')}}function closeHelp(w){w.classList.remove('is-open');const p=w.querySelector('.help-popover'),b=w.querySelector('.help-icon');if(p)p.hidden=true;if(b)b.setAttribute('aria-expanded','false')}}render();
})();
</script>
</body></html>
